<script type="module">
import * as THREE from 'three';
import {PointerLockControls} from 'three/addons/controls/PointerLockControls.js';

const CFG={WS:400,TS:100,WL:2,G:28,SPD:9,JMP:9,ID:7,DD:90};
const G={time:8,inv:{},hb:new Array(5).fill(null),sel:0,craft:false,res:[],blds:[],keys:{},pl:{vel:new THREE.Vector3,on:false},ter:null,wat:null,ghost:null,stress:0,weather:'clear',rainPts:null,rainVel:[],audioCtx:null,audioNodes:{},audioOn:false,gridPower:0,gridLoad:0,totalBuildings:0,scene:null};

function initAudio(){if(G.audioOn)return;G.audioCtx=new(window.AudioContext||window.webkitAudioContext)();const hum=G.audioCtx.createOscillator();hum.type='sine';hum.frequency.value=60;const humGain=G.audioCtx.createGain();humGain.gain.value=0.015;hum.connect(humGain);humGain.connect(G.audioCtx.destination);hum.start();G.audioNodes={hum,humGain};G.audioOn=true}
function playPing(f){if(!G.audioCtx)return;const o=G.audioCtx.createOscillator();const g=G.audioCtx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.08,G.audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,G.audioCtx.currentTime+0.5);o.connect(g);g.connect(G.audioCtx.destination);o.start();o.stop(G.audioCtx.currentTime+0.5)}
function updateAudio(){if(!G.audioCtx||!G.audioNodes.hum)return;const load=G.gridLoad/Math.max(1,G.totalBuildings);G.audioNodes.hum.frequency.value=60+load*20;G.audioNodes.humGain.gain.value=0.015+load*0.03;document.getElementById('hl').textContent=Math.round(load*100)}

function h2(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
function n2d(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);return(h2(ix,iy)*(1-ux)+h2(ix+1,iy)*ux)*(1-uy)+(h2(ix,iy+1)*(1-ux)+h2(ix+1,iy+1)*ux)*uy}
function fbm(x,y,o=4){let v=0,a=.5,f=1;for(let i=0;i<o;i++){v+=n2d(x*f,y*f)*a;a*=.5;f*=2.1}return v}
function gth(x,z){let h=fbm(x*.015+100,z*.015+100,5)*30;h+=fbm(x*.05,z*.05,2)*6;if(h<CFG.WL+2)h=THREE.MathUtils.lerp(h,CFG.WL-.5,.65);return h}
function gbc(h,x,z){if(h<CFG.WL+.3)return new THREE.Color(0x1a3d5c);if(h<CFG.WL+2.5)return new THREE.Color(0xcbbfa3);if(h<18)return new THREE.Color().lerpColors(new THREE.Color(0x4a7c3a),new THREE.Color(0x5d9e4a),n2d(x*.08,z*.08));if(h<26)return new THREE.Color().lerpColors(new THREE.Color(0x3d6b2e),new THREE.Color(0x4f853d),n2d(x*.08,z*.08));if(h<36)return new THREE.Color().lerpColors(new THREE.Color(0x6e6e6e),new THREE.Color(0x858585),n2d(x*.08,z*.08));return new THREE.Color(0xf2f2f2)}
function genTerrain(){const geo=new THREE.PlaneGeometry(CFG.WS,CFG.WS,CFG.TS,CFG.TS);const pos=geo.attributes.position,cols=[];for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getY(i),h=gth(x,z);pos.setZ(i,h);const c=gbc(h,x,z);cols.push(c.r,c.g,c.b)}geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));geo.computeVertexNormals();const mat=new THREE.MeshPhysicalMaterial({vertexColors:true,flatShading:true,roughness:.92,metalness:0,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });const m=new THREE.Mesh(geo,mat);m.rotation.x=-Math.PI/2;m.receiveShadow=true;return m}
function createWater(){const geo=new THREE.PlaneGeometry(CFG.WS,CFG.WS,60,60);const mat=new THREE.MeshPhysicalMaterial({color:0x006b8f,transmission:.65,opacity:.85,metalness:.1,roughness:.08,ior:1.33,thickness:1.5,transparent:true,flatShading:true,side:THREE.DoubleSide,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
    });const m=new THREE.Mesh(geo,mat);m.rotation.x=-Math.PI/2;m.position.y=CFG.WL;return m}
function mkTree(x,z,h){const g=new THREE.Group();const tk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2.2,5),new THREE.MeshPhysicalMaterial({color:0x5c3a21,flatShading:true,roughness:1,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }));tk.position.y=1.1;tk.castShadow=true;g.add(tk);const lm=new THREE.MeshPhysicalMaterial({color:0x4a7c3a,flatShading:true,roughness:.9,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });for(let i=0;i<3;i++){const s=1.4-i*.35;const l=new THREE.Mesh(new THREE.IcosahedronGeometry(s,0),lm);l.position.y=2.4+i*.9;l.castShadow=true;g.add(l)}g.position.set(x,h,z);g.scale.setScalar(.8+Math.random()*.5);g.rotation.y=Math.random()*Math.PI*2;g.userData={type:'tree',name:'Oak',res:'wood',amt:2};return g}
function mkRock(x,z,h){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(Math.random()*.6+.4,0),new THREE.MeshPhysicalMaterial({color:0x858585,flatShading:true,roughness:.75,metalness:.15,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }));m.position.set(x,h+.25,z);m.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);m.castShadow=true;m.userData={type:'rock',name:'Granite',res:'stone',amt:1};return m}
function mkOre(x,z,h){const m=new THREE.Mesh(new THREE.OctahedronGeometry(.55,0),new THREE.MeshPhysicalMaterial({color:0xff4400,emissive:0xff2200,emissiveIntensity:.6,flatShading:true,roughness:.35,metalness:.85,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }));m.position.set(x,h+.45,z);m.castShadow=true;m.userData={type:'ore',name:'Iron Vein',res:'ore',amt:1};return m}
function mkBush(x,z,h){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.5,0),new THREE.MeshPhysicalMaterial({color:0x6a9e52,flatShading:true,roughness:.9,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }));m.position.set(x,h+.35,z);m.scale.y=.65;m.castShadow=true;m.userData={type:'bush',name:'Fiber',res:'fiber',amt:1};return m}
function addResources(sc){for(let i=0;i<350;i++){const x=(Math.random()-.5)*CFG.WS*.92,z=(Math.random()-.5)*CFG.WS*.92,h=gth(x,z);if(h<CFG.WL+.8)continue;const r=Math.random();let o=null;if(h>32&&r<.35)o=mkOre(x,z,h);else if(h>22&&r<.45)o=mkRock(x,z,h);else if(h>5&&r<.75)o=mkTree(x,z,h);else if(h>5&&r<.9)o=mkBush(x,z,h);if(o){sc.add(o);G.res.push(o)}}}

// BUILDINGS — Structural + MEP
function mkCampfire(){const g=new THREE.Group();for(let i=0;i<7;i++){const a=i/7*Math.PI*2;const s=new THREE.Mesh(new THREE.DodecahedronGeometry(.14,0),new THREE.MeshPhysicalMaterial({color:0x777777,flatShading:true,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }));s.position.set(Math.cos(a)*.45,.08,Math.sin(a)*.45);g.add(s)}const lg=new THREE.CylinderGeometry(.07,.07,.9,4);const lm=new THREE.MeshPhysicalMaterial({color:0x5c3a21,flatShading:true,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });const l1=new THREE.Mesh(lg,lm);l1.rotation.set(Math.PI/2,Math.PI/4,0);const l2=new THREE.Mesh(lg,lm);l2.rotation.set(Math.PI/2,-Math.PI/4,0);g.add(l1,l2);const lt=new THREE.PointLight(0xff6600,4,18,2);lt.position.y=.6;lt.castShadow=true;g.add(lt);const c=new THREE.Mesh(new THREE.IcosahedronGeometry(.18,0),new THREE.MeshPhysicalMaterial({color:0xff5500,emissive:0xff4400,emissiveIntensity:3,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }));c.position.y=.25;g.add(c);g.userData={type:'building',name:'Campfire',light:lt,core:c,power:0,stress:0};return g}
function mkWall(){const m=new THREE.Mesh(new THREE.BoxGeometry(2,2.2,.25),new THREE.MeshPhysicalMaterial({color:0x8b7355,flatShading:true,roughness:.92,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }));m.castShadow=true;m.receiveShadow=true;m.userData={type:'building',name:'Wall',stress:0,structural:true};return m}
function mkFoundation(){const m=new THREE.Mesh(new THREE.BoxGeometry(2,.2,2),new THREE.MeshPhysicalMaterial({color:0x777777,flatShading:true,roughness:.85,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }));m.receiveShadow=true;m.userData={type:'building',name:'Foundation',stress:0,structural:true};return m}
function mkGenerator(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(1.5,.8,.8),new THREE.MeshPhysicalMaterial({color:0x334455,flatShading:true,metalness:.7,roughness:.3,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }));b.position.y=.4;g.add(b);const p=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.5,6),new THREE.MeshPhysicalMaterial({color:0x885522,metalness:.9,roughness:.2,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }));p.position.y=.9;p.rotation.z=Math.PI/2;g.add(p);const lt=new THREE.PointLight(0x00ff44,.8,8,2);lt.position.y=.6;g.add(lt);g.userData={type:'building',name:'Generator',generator:true,power:100,stress:0,light:lt};return g}

// WEATHER
function updateWeather(sc){
  const r=Math.random();
  if(r<.002)G.weather=G.weather==='rain'?'clear':'rain';
  if(G.weather==='rain'){
    if(!G.rainPts){const geo=new THREE.BufferGeometry();const count=800;const pos=new Float32Array(count*3);for(let i=0;i<count;i++){pos[i*3]=(Math.random()-.5)*CFG.WS*.8;pos[i*3+1]=15+Math.random()*30;pos[i*3+2]=(Math.random()-.5)*CFG.WS*.8;G.rainVel.push({y:-20-Math.random()*15})}geo.setAttribute('position',new THREE.BufferAttribute(pos,3));G.rainPts=new THREE.Points(geo,new THREE.PointsMaterial({color:0x88aacc,size:.15,transparent:true,opacity:.5}));sc.add(G.rainPts)}
    const pts=G.rainPts.geometry.attributes.position;for(let i=0;i<pts.count;i++){pts.setY(i,pts.getY(i)+G.rainVel[i].y*.016);if(pts.getY(i)<-2){pts.setY(i,25+Math.random()*15);pts.setX(i,(Math.random()-.5)*CFG.WS*.8);pts.setZ(i,(Math.random()-.5)*CFG.WS*.8)}}pts.needsUpdate=true
  }else if(G.rainPts){sc.remove(G.rainPts);G.rainPts.geometry.dispose();G.rainPts.material.dispose();G.rainPts=null;G.rainVel=[]}}

// STRUCTURAL SIM
function updateStructural(){
  let totalStress=0,load=0;G.totalBuildings=G.blds.length;
  G.blds.forEach(b=>{if(!b.userData.structural)return;b.userData.stress=Math.min(100,b.userData.stress+.02);if(G.weather==='rain')b.userData.stress+=.15;if(b.userData.stress>80){b.material.emissive=new THREE.Color(.1,0,0);b.material.emissiveIntensity=.3}else if(b.userData.stress>50){b.material.emissive=new THREE.Color(.05,.02,0);b.material.emissiveIntensity=.15}totalStress+=b.userData.stress;load+=b.userData.stress;if(b.userData.stress>95&&Math.random()<.01){playPing(440);spawnParticles(b.position,0xff4400,G.scene)}});
  G.blds.forEach(b=>{if(b.userData.generator){load-=b.userData.power;G.gridPower=b.userData.power}});
  G.stress=totalStress/Math.max(1,G.blds.filter(b=>b.userData.structural).length);
  G.gridLoad=Math.max(0,load);
  const bar=document.getElementById('stress-bar');bar.style.width=G.stress+'%';bar.style.background=G.stress>80?'#ff4444':G.stress>50?'#ff9944':'#44ff44'}

// STARS + DAY/NIGHT
function createStars(){const geo=new THREE.BufferGeometry();const count=1200;const pos=new Float32Array(count*3);for(let i=0;i<count;i++){const r=250+Math.random()*150,theta=Math.random()*Math.PI*2,phi=Math.acos(2*Math.random()-1);pos[i*3]=r*Math.sin(phi)*Math.cos(theta);pos[i*3+1]=r*Math.sin(phi)*Math.sin(theta);pos[i*3+2]=r*Math.cos(phi)}geo.setAttribute('position',new THREE.BufferAttribute(pos,3));return new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:.6,transparent:true,opacity:0}))}
function legendre(a, p) {
  if (a % p === 0) return 0;
  let val = 1;
  for (let i = 0; i < (p - 1) / 2; i++) { val = (val * (a % p)) % p; }
  return val === p - 1 ? -1 : 1;
}

function updateDayNight(dt,sun,moon,stars,sc){
  G.time+=(dt/CFG.DD)*24;
  if(G.time>=24)G.time-=24;
  const t=G.time,angle=((t-6)/24)*Math.PI*2,sy=Math.sin(angle),sx=Math.cos(angle);
  sun.position.set(sx*180,sy*180,-60);
  sun.intensity=Math.max(0,sy)*2.2;
  moon.position.set(-sx*120,-sy*120,-60);
  moon.intensity=Math.max(0,-sy)*.4;
  
  let sc2,fc,fd;
  if(t<5||t>21){sc2=new THREE.Color(0x04060a);fc=new THREE.Color(0x04060a);fd=.018}
  else if(t<7){const p=(t-5)/2;sc2=new THREE.Color().lerpColors(new THREE.Color(0x04060a),new THREE.Color(0xff9966),p);fc=sc2;fd=.012}
  else if(t<17){sc2=new THREE.Color(0x87ceeb);fc=new THREE.Color(0xcce8ff);fd=.005}
  else if(t<19){const p=(t-17)/2;sc2=new THREE.Color().lerpColors(new THREE.Color(0x87ceeb),new THREE.Color(0xff6644),p);fc=sc2;fd=.008}
  else {const p=(t-19)/2;sc2=new THREE.Color().lerpColors(new THREE.Color(0xff6644),new THREE.Color(0x04060a),p);fc=sc2;fd=.014}
  
  // --- STRIDE-24 CELESTIAL RESONANCE ---
  const activeResidues = [1, 5, 7, 11, 13, 17, 19, 23];
  const currentHour = Math.floor(t);
  const isActive = activeResidues.includes(currentHour);
  
  let skyR = sc2.r;
  let skyG = sc2.g;
  let skyB = sc2.b;
  
  if (isActive) {
    const leg7 = legendre(currentHour, 7);
    const leg11 = legendre(currentHour, 11);
    // Active phase: neon interference waves (auroras)
    skyR += leg7 * 0.08 * Math.sin(t * 4.0);
    skyG += leg11 * 0.12 * Math.cos(t * 3.0);
    skyB += (leg7 * leg11) * 0.09 * Math.sin(t * 2.0);
    stars.material.opacity = Math.max(stars.material.opacity, 0.45 + 0.35 * leg7 * Math.sin(t * 12.0));
  } else {
    // Ghost phase: subdued sky tones
    skyR *= 0.8;
    skyG *= 0.78;
    skyB *= 0.88;
  }
  
  sc2.setRGB(Math.max(0, Math.min(1, skyR)), Math.max(0, Math.min(1, skyG)), Math.max(0, Math.min(1, skyB)));
  
  sc.background=sc2;
  sc.fog.color=fc;
  sc.fog.density=fd;
  stars.material.opacity=(t<6||t>20)?Math.min(1,(t<6?1-(t-5):t-20)):0;
  const hrs=Math.floor(t),mins=Math.floor((t-hrs)*60);
  document.getElementById('time').textContent=`${hrs%12||12}:${mins.toString().padStart(2,'0')} ${hrs>=12?'PM':'AM'}`;
}

// PLAYER
function updatePlayer(dt,cam,ctl){if(!ctl.isLocked)return;const d=new THREE.Vector3();if(G.keys['KeyW'])d.z-=1;if(G.keys['KeyS'])d.z+=1;if(G.keys['KeyA'])d.x-=1;if(G.keys['KeyD'])d.x+=1;if(d.lengthSq()>0){d.normalize().applyQuaternion(cam.quaternion);d.y=0;d.normalize();cam.position.x+=d.x*CFG.SPD*dt;cam.position.z+=d.z*CFG.SPD*dt}G.pl.vel.y-=CFG.G*dt;cam.position.y+=G.pl.vel.y*dt;const gh=gth(cam.position.x,cam.position.z);if(cam.position.y<gh+1.7){cam.position.y=gh+1.7;G.pl.vel.y=0;G.pl.on=true}else{G.pl.on=false}const lim=CFG.WS/2-4;cam.position.x=THREE.MathUtils.clamp(cam.position.x,-lim,lim);cam.position.z=THREE.MathUtils.clamp(cam.position.z,-lim,lim)}

// PARTICLES
function spawnParticles(pos,col,sc){const count=10;const geo=new THREE.BufferGeometry();const pos2=new Float32Array(count*3);const vels=[];for(let i=0;i<count;i++){pos2[i*3]=pos.x;pos2[i*3+1]=pos.y+.5;pos2[i*3+2]=pos.z;vels.push({x:(Math.random()-.5)*4,y:Math.random()*3+1,z:(Math.random()-.5)*4})}geo.setAttribute('position',new THREE.BufferAttribute(pos2,3));const mat=new THREE.PointsMaterial({color:col,size:.25,transparent:true,opacity:1});const pts=new THREE.Points(geo,mat);sc.add(pts);let life=1;function anim(){life-=.025;if(life<=0){sc.remove(pts);geo.dispose();mat.dispose();return}const p=geo.attributes.position;for(let i=0;i<count;i++){p.setX(i,p.getX(i)+vels[i].x*.016);p.setY(i,p.getY(i)+vels[i].y*.016);p.setZ(i,p.getZ(i)+vels[i].z*.016);vels[i].y-=.12}p.needsUpdate=true;mat.opacity=life;requestAnimationFrame(anim)}anim()}

// INTERACTION
function interact(cam,sc){const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(0,0),cam);const hits=rc.intersectObjects(G.res,true);if(hits.length>0&&hits[0].distance<CFG.ID){let obj=hits[0].object;while(obj.parent&&!obj.userData.type)obj=obj.parent;if(obj.userData.res){const r=obj.userData.res;G.inv[r]=(G.inv[r]||0)+obj.userData.amt;spawnParticles(obj.position,0xffcc44,sc);sc.remove(obj);G.res=G.res.filter(x=>x!==obj);updateUI();return}}const item=G.hb[G.sel];if(item&&item.placeable){const th=rc.intersectObject(G.ter);if(th.length>0&&th[0].distance<CFG.ID){const pt=th[0].point,n=th[0].face.normal.clone().transformDirection(G.ter.matrixWorld).normalize();placeBuilding(pt,n,item.name,sc)}}}
function placeBuilding(pt,n,name,sc){let b;if(name==='Campfire')b=mkCampfire();else if(name==='Wall')b=mkWall();else if(name==='Foundation')b=mkFoundation();else if(name==='Generator')b=mkGenerator();if(!b)return;b.position.copy(pt).add(n.multiplyScalar(.05));b.position.x=Math.round(b.position.x);b.position.z=Math.round(b.position.z);if(name==='Foundation')b.position.y=pt.y+.1;else if(name==='Wall')b.position.y=pt.y+1.1;else b.position.y=pt.y+.05;sc.add(b);G.blds.push(b);G.hb[G.sel]=null;updateUI();if(G.ghost){sc.remove(G.ghost);G.ghost=null}}

// CRAFTING
const RECIPES=[{name:'Stone Axe',icon:'🪓',req:{wood:2,stone:1},placeable:false},{name:'Pickaxe',icon:'⛏️',req:{wood:2,stone:2},placeable:false},{name:'Campfire',icon:'🔥',req:{wood:3,stone:1},placeable:true},{name:'Wall',icon:'🧱',req:{wood:2,stone:1},placeable:true},{name:'Foundation',icon:'🏗️',req:{wood:3,stone:2},placeable:true},{name:'Generator',icon:'⚡',req:{ore:3,stone:4},placeable:true}];
function canCraft(r){for(const[k,v]of Object.entries(r.req)){if((G.inv[k]||0)<v)return false}return true}
function craft(r){if(!canCraft(r))return;for(const[k,v]of Object.entries(r.req))G.inv[k]-=v;for(let i=0;i<G.hb.length;i++){if(!G.hb[i]){G.hb[i]=r;break}}updateUI();renderCraft()}
function toggleCraft(){G.craft=!G.craft;const m=document.getElementById('craft');m.style.display=G.craft?'block':'none';if(G.craft){document.exitPointerLock();renderCraft()}else{document.body.requestPointerLock()}}
function renderCraft(){const c=document.getElementById('recipes');c.innerHTML='';RECIPES.forEach(r=>{const d=document.createElement('div');d.className='rc'+(canCraft(r)?'':' no');d.innerHTML=`<div><div class="rn">${r.icon} ${r.name}</div><div class="rcs">${Object.entries(r.req).map(([k,v])=>`${v} ${k}`).join(' · ')}</div></div><div class="rt">${r.placeable?'PLACE':'HOLD'}</div>`;if(canCraft(r))d.onclick=()=>craft(r);c.appendChild(d)})}
function updateUI(){const bar=document.getElementById('hotbar');bar.innerHTML='';G.hb.forEach((item,i)=>{const slot=document.createElement('div');slot.className='slot'+(i===G.sel?' active':'');slot.innerHTML=`<span class="kh">${i+1}</span>`;if(item)slot.innerHTML+=`${item.icon}<span class="lb">${item.name}</span>`;slot.onclick=()=>{G.sel=i;updateUI()};bar.appendChild(slot)})}

// MAIN
async function init(){const container=document.getElementById('c');const scene=new THREE.Scene();G.scene=scene;scene.fog=new THREE.FogExp2(0x87ceeb,.005);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.outputColorSpace=THREE.SRGBColorSpace;container.appendChild(renderer.domElement);const controls=new PointerLockControls(camera,document.body);scene.add(new THREE.HemisphereLight(0x87ceeb,0x2d2418,.5));const sun=new THREE.DirectionalLight(0xfff5e6,2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=.5;sun.shadow.camera.far=350;sun.shadow.camera.left=-160;sun.shadow.camera.right=160;sun.shadow.camera.top=160;sun.shadow.camera.bottom=-160;sun.shadow.bias=-.0005;
        // Programmatic Rim Light Addition (Hyperrealism Baseline)
        const rimLight = new THREE.DirectionalLight(0xffffff, 1.5);
        rimLight.position.set(-5, 5, -5); // Position behind the subject
        scene.add(rimLight);
        
        scene.add(sun);const moon=new THREE.DirectionalLight(0x4466aa,.3);scene.add(moon);const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.35,.5,.82));composer.addPass(new OutputPass());G.ter=genTerrain();scene.add(G.ter);G.wat=createWater();scene.add(G.wat);addResources(scene);for(let i=0;i<12;i++){const g=new THREE.Group();for(let j=0;j<3+Math.floor(Math.random()*4);j++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(2.5+Math.random()*3.5,0),new THREE.MeshPhysicalMaterial({color:0xffffff,flatShading:true,transparent:true,opacity:.75,roughness:1,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }));m.position.set((Math.random()-.5)*8,(Math.random()-.5)*3,(Math.random()-.5)*5);g.add(m)}g.position.set((Math.random()-.5)*CFG.WS*.7,45+Math.random()*25,(Math.random()-.5)*CFG.WS*.7);scene.add(g)}const stars=createStars();scene.add(stars);camera.position.set(0,gth(0,0)+2,0);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});document.addEventListener('keydown',e=>{G.keys[e.code]=true;if(e.code==='KeyC')toggleCraft();if(e.code==='Space'&&G.pl.on){G.pl.vel.y=CFG.JMP;initAudio()}if(e.code>='Digit1'&&e.code<='Digit5'){G.sel=parseInt(e.code[5])-1;updateUI()}});document.addEventListener('keyup',e=>{G.keys[e.code]=false});document.addEventListener('click',()=>{if(!controls.isLocked&&!G.craft)document.body.requestPointerLock();else if(controls.isLocked&&!G.craft)interact(camera,scene)});document.getElementById('load').style.opacity='0';setTimeout(()=>document.getElementById('load').style.display='none',600);updateUI();const clock=new THREE.Clock();let structTimer=0;const promptEl=document.getElementById('prompt');function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.1);const time=clock.getElapsedTime();updateDayNight(dt,sun,moon,stars,scene);updatePlayer(dt,camera,controls);const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(0,0),camera);let promptText='';const rh=rc.intersectObjects(G.res,true);if(rh.length>0&&rh[0].distance<CFG.ID){let obj=rh[0].object;while(obj.parent&&!obj.userData.type)obj=obj.parent;if(obj.userData.name)promptText=`[LMB] Gather ${obj.userData.name}`}else{const item=G.hb[G.sel];if(item&&item.placeable){const th=rc.intersectObject(G.ter);if(th.length>0&&th[0].distance<CFG.ID)promptText=`[LMB] Place ${item.name}`}}promptEl.textContent=promptText;promptEl.style.opacity=promptText?'1':'0';const item=G.hb[G.sel];if(!item||!item.placeable){if(G.ghost){scene.remove(G.ghost);G.ghost=null}}else{const th=rc.intersectObject(G.ter);if(th.length>0&&th[0].distance<CFG.ID){if(!G.ghost){if(item.name==='Campfire')G.ghost=mkCampfire();else if(item.name==='Wall')G.ghost=mkWall();else if(item.name==='Foundation')G.ghost=mkFoundation();else if(item.name==='Generator')G.ghost=mkGenerator();if(G.ghost){G.ghost.traverse(c=>{if(c.isMesh){c.material=c.material.clone();c.material.transparent=true;c.material.opacity=.35}if(c.isLight)c.intensity=0});scene.add(G.ghost)}}if(G.ghost){const pt=th[0].point,n=th[0].face.normal.clone().transformDirection(G.ter.matrixWorld).normalize();G.ghost.position.copy(pt).add(n.multiplyScalar(.05));G.ghost.position.x=Math.round(G.ghost.position.x);G.ghost.position.z=Math.round(G.ghost.position.z);if(item.name==='Foundation')G.ghost.position.y=pt.y+.1;else if(item.name==='Wall')G.ghost.position.y=pt.y+1.1;else G.ghost.position.y=pt.y+.05}}else{if(G.ghost){scene.remove(G.ghost);G.ghost=null}}}const wpos=G.wat.geometry.attributes.position;for(let i=0;i<wpos.count;i++){const x=wpos.getX(i),y=wpos.getY(i);wpos.setZ(i,Math.sin(x*.25+time)*.25+Math.sin(y*.2+time*.8)*.2)}wpos.needsUpdate=true;G.blds.forEach(b=>{if(b.userData.light)b.userData.light.intensity=3.5+Math.sin(time*12)*.6+Math.random()*.4;if(b.userData.core)b.userData.core.scale.setScalar(1+Math.sin(time*10)*.08)});structTimer+=dt;if(structTimer>1){structTimer=0;updateStructural();updateWeather(scene);if(G.audioOn)updateAudio()}document.getElementById('ht').textContent=Math.round(20+G.stress*.3+Math.sin(time*.1)*3);document.getElementById('hp').textContent=G.gridPower;composer.render()}animate()}init().catch(console.error);</script></body></html>
