<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RESONANCE DIAGNOSTIC HUD — Phase 3: The Eye</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a10;color:#88aacc;font:12px 'Courier New',monospace;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0}
#overlay{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}
.panel{position:fixed;background:rgba(5,10,16,.92);border:1px solid #224466;border-radius:4px;padding:10px;z-index:20}
#top-left{top:10px;left:10px;width:280px}
#top-right{top:10px;right:10px;width:260px}
#bottom{position:fixed;bottom:10px;left:10px;right:10px;z-index:20;display:flex;gap:10px;flex-wrap:wrap}
.card{background:rgba(5,10,16,.9);border:1px solid #334466;border-radius:3px;padding:8px 12px;min-width:160px}
.card .label{color:#557799;font-size:9px;letter-spacing:1px}
.card .value{color:#aaccee;font-size:18px;font-weight:bold;margin:4px 0 0}
.card.warn{border-color:#664422}.card.warn .value{color:#ffaa44}
.card.critical{border-color:#662222}.card.critical .value{color:#ff4444}
.card.nominal{border-color:#224466}.card.nominal .value{color:#88cc88}
h3{color:#557799;font-size:10px;letter-spacing:2px;margin:0 0 8px;text-transform:uppercase}
.bar{height:3px;background:#224466;border-radius:1px;margin:2px 0;overflow:hidden}
.bar-fill{height:100%;border-radius:1px;transition:width .3s}
.meter-label{display:flex;justify-content:space-between;font-size:9px;color:#557799;margin:1px 0}
#event-log{max-height:80px;overflow-y:auto;font-size:9px;color:#557799;line-height:1.4}
#event-log .ev{color:#88aacc}
#event-log .ev.warn{color:#ffaa44}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel" id="top-left">
  <h3>⚡ RESONANCE SPECTRUM</h3>
  <canvas id="spectrum" width="260" height="120"></canvas>
</div>

<div class="panel" id="top-right">
  <h3>📊 SYSTEM STATUS</h3>
  <div class="meter-label"><span>GRID LOAD</span><span id="grid-pct">100%</span></div>
  <div class="bar"><div id="grid-bar" class="bar-fill" style="width:60%;background:#88cc88"></div></div>
  <div class="meter-label"><span>LUMINANCE</span><span id="lum-pct">40%</span></div>
  <div class="bar"><div id="lum-bar" class="bar-fill" style="width:40%;background:#aaccee"></div></div>
  <div class="meter-label"><span>THERMAL</span><span id="therm-pct">25°C</span></div>
  <div class="bar"><div id="therm-bar" class="bar-fill" style="width:25%;background:#ff8844"></div></div>
  <div class="meter-label"><span>HUM FREQ</span><span id="hum-pct">120Hz</span></div>
  <div class="bar"><div id="hum-bar" class="bar-fill" style="width:30%;background:#cc88ff"></div></div>
  <div class="meter-label"><span>AIRFLOW</span><span id="air-pct">50%</span></div>
  <div class="bar"><div id="air-bar" class="bar-fill" style="width:50%;background:#88ccdd"></div></div>
</div>

<div id="bottom">
  <div class="card nominal" id="card-grid">
    <div class="label">GRID VOLTAGE</div><div class="value">1.00 pu</div>
  </div>
  <div class="card nominal" id="card-light">
    <div class="label">LIGHT SYSTEM</div><div class="value">0.40</div>
  </div>
  <div class="card nominal" id="card-acoustic">
    <div class="label">TRANSFORMER</div><div class="value">220 Hz</div>
  </div>
  <div class="card nominal" id="card-thermal">
    <div class="label">CONDUIT TEMP</div><div class="value">62.5°C</div>
  </div>
  <div class="card nominal" id="card-hvac">
    <div class="label">HVAC FLOW</div><div class="value">0.50 m/s</div>
  </div>
  <div class="card" style="min-width:280px">
    <div class="label">EVENT LOG</div>
    <div id="event-log"><div class="ev">✓ Phase 2 Resonance active — 4 transfer functions online</div></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// RESONANCE DIAGNOSTIC HUD — Phase 3: The Eye
// Renders invisible simulation state as live visualization
// ═══════════════════════════════════════════════════════

const $=id=>document.getElementById(id);

// ── Simulation state (connected to Phase 2) ──
let state={
  grid_voltage:1.0,      // per-unit (1.0 = nominal)
  grid_load:0.6,          // 0-1
  light_output:0.4,       // emissive intensity
  acoustic_freq:120,      // Hz (fundamental: 60, harmonics: 120, 180)
  conduit_temp:25,        // °C (ambient baseline)
  hvac_flow:0.5,          // m/s
  ambient_temp:22,
  time:0
};

// ── CANVAS: Background resonance field ──
const C=document.getElementById('c');
const ctx=C.getContext('2d');
let W,H;

function resize(){
  W=C.width=innerWidth;H=C.height=innerHeight;
}
resize();window.addEventListener('resize',resize);

// ── Draw background resonance field ──
let particles=[];
for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,
    size:1+Math.random()*2,
    phase:Math.random()*Math.PI*2
  });
}

function drawBackground(t){
  ctx.fillStyle='rgba(5,10,16,.15)';
  ctx.fillRect(0,0,W,H);

  // Resonance particles — drift toward grid lines
  const gridOpacity=.03+.02*state.grid_load;
  ctx.strokeStyle='#224466';
  ctx.lineWidth=.5;
  for(let x=0;x<W;x+=40)for(let y=0;y<H;y+=40){
    ctx.globalAlpha=gridOpacity+Math.sin(t*.5+x*.01+y*.01)*.01;
    ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Drift particles (airflow visualization)
  for(let p of particles){
    p.x+=p.vx+Math.sin(t*2+p.phase)*.1*state.hvac_flow;
    p.y+=p.vy+Math.cos(t*1.7+p.phase)*.1*state.hvac_flow;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;
    if(p.y<0)p.y=H;if(p.y>H)p.y=0;

    const d=Math.sqrt((p.x-W/2)**2+(p.y-H/2)**2)/Math.max(W,H);
    const alpha=.08+.04*state.grid_load*(1-d);
    ctx.fillStyle=`rgba(136,170,204,${alpha})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
}

// ── SPECTRUM CANVAS — Frequency domain ──
const SC=document.getElementById('spectrum');
const sCtx=SC.getContext('2d');
const SW=SC.width,SH=SC.height;

function drawSpectrum(t){
  sCtx.fillStyle='rgba(5,10,16,.3)';
  sCtx.fillRect(0,0,SW,SH);

  // Frequency bands (0-300Hz)
  const bands=48;
  const barW=SW/bands;

  for(let i=0;i<bands;i++){
    const freq=i*(300/bands);
    let amp=0;

    // 60Hz fundamental
    amp+=Math.exp(-((freq-60)/8)**2)*.6*state.grid_load;
    // 120Hz harmonic  
    amp+=Math.exp(-((freq-120)/12)**2)*.4*state.grid_load;
    // 180Hz harmonic
    amp+=Math.exp(-((freq-180)/15)**2)*.25*state.grid_load;
    // 30Hz sub-harmonic (transformer saturation)
    amp+=Math.exp(-((freq-30)/6)**2)*.3*(state.grid_load**2);
    // Broadband noise
    amp+=.02*Math.random()*state.grid_load;

    const h=amp*SH*.7;
    const x=i*barW,y=SH-h;

    // Color based on frequency
    const r=freq<80?255:freq<150?136:100;
    const g=freq<80?136:freq<150?170:180;
    const b=freq<80?100:freq<150?204:255;
    sCtx.fillStyle=`rgb(${r},${g},${b})`;
    sCtx.fillRect(x,y,barW-1,h);

    // Peak marker
    if(freq>=55&&freq<=65||freq>=115&&freq<=125||freq>=175&&freq<=185){
      sCtx.fillStyle='rgba(255,170,68,.6)';
      sCtx.fillRect(x,SH-4,barW-1,2);
    }
  }

  // Grid lines
  sCtx.strokeStyle='#224466';
  sCtx.lineWidth=.5;
  for(let f=60;f<=300;f+=60){
    const x=(f/300)*SW;
    sCtx.beginPath();sCtx.moveTo(x,0);sCtx.lineTo(x,SH);sCtx.stroke();
    sCtx.fillStyle='#557799';sCtx.font='8px monospace';
    sCtx.fillText(f+'Hz',x+2,SH-2);
  }
}

// ── TRANSFER FUNCTIONS (from Phase 2) ──
function updateLight(grid_v){
  const L0=.4,G=1+.03*Math.sin(2*Math.PI*60*state.time);
  const S=1-.2*(grid_v**2);
  return L0*G*S;
}

function updateAcoustic(grid_v){
  const f0=60,f1=120*(1+.05*(1-grid_v)),f_sub=30*(1+.1*((1-grid_v)**2));
  return f1; // return dominant harmonic
}

function updateThermal(grid_v){
  const I=1-grid_v; // current increases as voltage sags (constant power draw)
  const P=I*I*100; // I²R with R=100 (arbitrary units)
  const R_thermal=.5;
  return 22+P*R_thermal; // ambient + rise
}

function updateHVAC(grid_v){
  // HVAC compensates for thermal load
  return .5+(1-grid_v)*.3; // faster fan when voltage low = more heat
}

// ── MAIN LOOP ──
let logEntries=[];
function addLog(msg,warn=false){
  const now=new Date().toLocaleTimeString();
  logEntries.unshift({time:now,msg,warn});
  if(logEntries.length>20)logEntries.length=20;
  const el=$('event-log');
  el.innerHTML=logEntries.map(l=>
    `<div class="ev${l.warn?' warn':''}">${l.time} ${l.msg}</div>`
  ).join('');
}

// Simulate brownout events
let brownoutTimer=0,brownoutTarget=1.0;

function loop(t){
  requestAnimationFrame(loop);
  state.time=t*.001;

  // Brownout simulation — every 8 seconds
  brownoutTimer+=1/60;
  if(brownoutTimer>8){
    brownoutTimer=0;
    brownoutTarget=brownoutTarget===1.0?.5:.7;
    state.grid_voltage=brownoutTarget;
    addLog(`Brownout: grid → ${brownoutTarget.toFixed(2)} pu`,brownoutTarget<.7);
  }

  // Smooth transition
  state.grid_voltage+=(brownoutTarget-state.grid_voltage)*.02;
  state.grid_load=1-state.grid_voltage;

  // Transfer functions
  state.light_output=updateLight(state.grid_voltage);
  state.acoustic_freq=updateAcoustic(state.grid_voltage);
  state.conduit_temp=updateThermal(state.grid_voltage);
  state.hvac_flow=updateHVAC(state.grid_voltage);

  // ── Update UI ──
  // Bars
  $('grid-pct').textContent=`${(state.grid_voltage*100).toFixed(0)}%`;
  $('grid-bar').style.width=`${state.grid_voltage*100}%`;
  $('grid-bar').style.background=state.grid_voltage>.8?'#88cc88':state.grid_voltage>.6?'#ffaa44':'#ff4444';

  $('lum-pct').textContent=`${(state.light_output*100).toFixed(0)}%`;
  $('lum-bar').style.width=`${state.light_output*100}%`;

  $('therm-pct').textContent=`${state.conduit_temp.toFixed(0)}°C`;
  $('therm-bar').style.width=`${Math.min(100,state.conduit_temp)}%`;
  $('therm-bar').style.background=state.conduit_temp>60?'#ff4444':'#ff8844';

  $('hum-pct').textContent=`${state.acoustic_freq.toFixed(0)}Hz`;
  $('hum-bar').style.width=`${(state.acoustic_freq/300)*100}%`;

  $('air-pct').textContent=`${(state.hvac_flow*100).toFixed(0)}%`;
  $('air-bar').style.width=`${state.hvac_flow*100}%`;

  // Cards
  $('card-grid').querySelector('.value').textContent=`${state.grid_voltage.toFixed(2)} pu`;
  $('card-light').querySelector('.value').textContent=state.light_output.toFixed(2);
  $('card-acoustic').querySelector('.value').textContent=`${state.acoustic_freq.toFixed(0)} Hz`;
  $('card-thermal').querySelector('.value').textContent=`${state.conduit_temp.toFixed(1)}°C`;
  $('card-hvac').querySelector('.value').textContent=`${state.hvac_flow.toFixed(2)} m/s`;

  // Card status colors
  ['grid','light','acoustic','thermal','hvac'].forEach(id=>{
    const card=$( `card-${id}`);
    card.className='card '+(state.grid_voltage<.6?'critical':state.grid_voltage<.8?'warn':'nominal');
  });

  // ── Render ──
  drawBackground(state.time);
  drawSpectrum(state.time);
}

addLog('✓ Phase 3 Diagnostic HUD online — 4 transfer functions monitored');
addLog('✓ Brownout simulation active — 8s cycle');
requestAnimationFrame(loop);
</script>
</body>
</html>
