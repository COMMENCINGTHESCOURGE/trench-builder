<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KIRAGAMI — Folded Mecha</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a10;overflow:hidden;font:11px monospace}
#hud{position:absolute;top:10px;left:10px;color:#d4a854;z-index:10;font-size:9px;letter-spacing:1px;pointer-events:none}
#hud div{margin:2px 0}
#hud .title{color:#e8c864;font-size:11px;letter-spacing:2px}
#hud .fold{color:#c96;margin-left:8px}
#checkpoint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#888;font-size:10px;letter-spacing:3px;z-index:10;pointer-events:none}
#info{position:absolute;top:10px;right:10px;color:#556;font-size:8px;text-align:right;z-index:10;pointer-events:none}
</style>
</head>
<body>
<div id="hud">
  <div class="title">KIRAGAMI — 切金</div>
  <div>FOLDED-SHEET CONSTRUCTION</div>
  <div>Titanium Silver | Ceramic White | Champagne Gold | Carbon Black</div>
  <div style="margin-top:6px;color:#c96">FOLD COUNT: <span id="fold-count">12</span></div>
  <div class="fold">ANISOTROPIC BRDF — edges glow at fold vertices</div>
</div>
<div id="checkpoint">SUPINE — SCROLL TO FOLD</div>
<div id="info">MOUSE: orbit | SCROLL: checkpoint stage | RIGHT-CLICK: radial fold menu</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a0a10');
scene.fog = new THREE.FogExp2('#0a0a10', 0.0008);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(4, 3, 6);
camera.lookAt(0, 1.5, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;

// Post
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.3, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// Lighting
const ambient = new THREE.AmbientLight('#334466', 0.8);
scene.add(ambient);
const key = new THREE.DirectionalLight('#ffe8cc', 2.5);
key.position.set(5, 8, 3);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
scene.add(key);
const rim = new THREE.DirectionalLight('#d4a854', 1.2);
rim.position.set(-2, 1, -3);
scene.add(rim);
const hemi = new THREE.HemisphereLight('#8899cc', '#221108', 0.4);
scene.add(hemi);

// Checkpoint stages
const STAGES = ['SUPINE','SCOOT','CRAWL','STAND','BOUNCE','WALK','JUMP','RUN'];
let stage = 3; // Start at STAND

// Materials — Titanium Silver base, Ceramic White highlight, Champagne Gold edge, Carbon Black joint
const tiMat = new THREE.MeshStandardMaterial({
  color: '#c0c5cc', roughness: 0.35, metalness: 0.85,
  flatShading: true
});
const whMat = new THREE.MeshStandardMaterial({
  color: '#f0f2f5', roughness: 0.2, metalness: 0.3,
  flatShading: true
});
const auMat = new THREE.MeshStandardMaterial({
  color: '#d4a854', roughness: 0.15, metalness: 0.95,
  emissive: '#442200', emissiveIntensity: 0.4,
  flatShading: true
});
const cbMat = new THREE.MeshStandardMaterial({
  color: '#1a1a22', roughness: 0.5, metalness: 0.6,
  flatShading: true
});

// Build Kirigami Mech — single-sheet folded construction
const mech = new THREE.Group();

function createFold(shape, pos, rot, scale, mat=tiMat){
  const geo = shape;
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  if(rot) mesh.rotation.set(rot.x||0, rot.y||0, rot.z||0);
  if(scale) mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// Torso — folded box with Champagne Gold edge strips
const torsoGeo = new THREE.BoxGeometry(0.9, 1.2, 0.5, 2, 2, 2);
const torso = createFold(torsoGeo, new THREE.Vector3(0, 1.4, 0), null, new THREE.Vector3(1,1,1), tiMat);
mech.add(torso);

// Gold edge strips on torso creases
for(let y of [-0.5, 0, 0.5]){
  const edge = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.03, 0.52), auMat);
  edge.position.set(0, 1.4+y*0.6, 0);
  mech.add(edge);
}

// Shoulder arrays — folded wing-like plates
for(let side of [-1, 1]){
  const shoulder = new THREE.Group();
  for(let i=0; i<3; i++){
    const s = 0.5 - i*0.12;
    const plate = createFold(
      new THREE.BoxGeometry(0.15, 0.5, s, 2, 2, 1),
      new THREE.Vector3(side*0.55, 1.8+i*0.1, 0),
      new THREE.Vector3(0, 0, 0.15*side),
      new THREE.Vector3(1,1,1),
      i===0 ? auMat : whMat
    );
    mech.add(plate);
  }
}

// Head — faceted helm with Champagne Gold crest
const headGeo = new THREE.DodecahedronGeometry(0.22, 0);
const head = createFold(headGeo, new THREE.Vector3(0, 2.15, 0), null, new THREE.Vector3(1,1.2,1), tiMat);
mech.add(head);
const crest = createFold(new THREE.BoxGeometry(0.3, 0.04, 0.08), new THREE.Vector3(0, 2.35, 0), null, new THREE.Vector3(1,1,1), auMat);
mech.add(crest);

// Arms — folded plates with Carbon Black joints
for(let side of [-1, 1]){
  const upperArm = createFold(new THREE.BoxGeometry(0.18, 0.7, 0.18, 2, 3, 2), 
    new THREE.Vector3(side*0.6, 1.6, 0), null, new THREE.Vector3(1,1,1), tiMat);
  mech.add(upperArm);
  const elbow = createFold(new THREE.SphereGeometry(0.12, 6, 4),
    new THREE.Vector3(side*0.6, 1.2, 0), null, new THREE.Vector3(1,1,1), cbMat);
  mech.add(elbow);
  const forearm = createFold(new THREE.BoxGeometry(0.14, 0.6, 0.14, 2, 3, 2),
    new THREE.Vector3(side*0.6, 0.85, 0), new THREE.Vector3(0.1*side, 0, 0), new THREE.Vector3(1,1,1), tiMat);
  mech.add(forearm);
}

// Legs — digitigrade stance with folded knee joints
for(let side of [-1, 1]){
  const thigh = createFold(new THREE.BoxGeometry(0.22, 0.8, 0.2, 2, 3, 2),
    new THREE.Vector3(side*0.25, 0.7, 0), new THREE.Vector3(0.2*side, 0, 0), new THREE.Vector3(1,1,1), tiMat);
  mech.add(thigh);
  const knee = createFold(new THREE.SphereGeometry(0.1, 6, 4),
    new THREE.Vector3(side*0.25, 0.25, 0), null, new THREE.Vector3(1,1,1), auMat);
  mech.add(knee);
  // Digitigrade lower leg
  const shin = createFold(new THREE.BoxGeometry(0.16, 0.7, 0.16, 2, 3, 2),
    new THREE.Vector3(side*0.25, -0.15, 0.15), new THREE.Vector3(-0.4, 0, 0), new THREE.Vector3(1,1,1), tiMat);
  mech.add(shin);
  // Foot
  const foot = createFold(new THREE.BoxGeometry(0.2, 0.08, 0.35, 2, 2, 2),
    new THREE.Vector3(side*0.25, -0.52, 0.25), null, new THREE.Vector3(1,1,1), cbMat);
  mech.add(foot);
}

// Sword — folded geometry
const swordGroup = new THREE.Group();
const blade = createFold(new THREE.BoxGeometry(0.04, 1.2, 0.02, 2, 4, 1),
  new THREE.Vector3(0, 0.6, 0), null, new THREE.Vector3(1,1,1), whMat);
swordGroup.add(blade);
const guard = createFold(new THREE.BoxGeometry(0.25, 0.04, 0.08, 2, 2, 2),
  new THREE.Vector3(0, -0.05, 0), null, new THREE.Vector3(1,1,1), auMat);
swordGroup.add(guard);
const handle = createFold(new THREE.CylinderGeometry(0.04, 0.04, 0.3, 6),
  new THREE.Vector3(0, -0.2, 0), new THREE.Vector3(Math.PI/2,0,0), new THREE.Vector3(1,1,1), cbMat);
swordGroup.add(handle);
swordGroup.position.set(0.75, 1.2, 0.3);
swordGroup.rotation.set(0.3, -0.1, 0.5);
mech.add(swordGroup);

scene.add(mech);

// Ground — subtle reflective plane
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.MeshStandardMaterial({color:'#0a0a15', roughness:0.9, metalness:0.2})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.6;
ground.receiveShadow = true;
scene.add(ground);

// Stage transformations
function setStage(s){
  stage = s;
  const poses = {
    0: {spread:0, lean:0, head:0, arms:0},        // SUPINE
    1: {spread:0.2, lean:0.1, head:0.05, arms:0.15}, // SCOOT
    2: {spread:0.4, lean:0.2, head:0.1, arms:0.3},   // CRAWL
    3: {spread:0.6, lean:0, head:0, arms:0.1},        // STAND
    4: {spread:0.7, lean:0, head:0.02, arms:0.2},     // BOUNCE
    5: {spread:0.6, lean:0.15, head:0.05, arms:0.4},  // WALK
    6: {spread:1.0, lean:0.2, head:0.1, arms:0.6},    // JUMP
    7: {spread:0.8, lean:0.3, head:0.05, arms:0.7},   // RUN
  };
  const p = poses[s];
  document.getElementById('checkpoint').textContent = STAGES[s];
  
  // Animate the gold edge glow
  bloom.strength = 0.3 + s * 0.08;
  auMat.emissiveIntensity = 0.2 + s * 0.08;
}

// Fold menu on right-click
document.addEventListener('contextmenu', e => {
  e.preventDefault();
  stage = (stage + 1) % 8;
  setStage(stage);
});

// Scroll to change stage
document.addEventListener('wheel', e => {
  if(e.deltaY > 0) stage = Math.min(7, stage+1);
  else stage = Math.max(0, stage-1);
  setStage(stage);
});

setStage(3); // Start at STAND

// Count folds (gold edge strips + joint spheres)
document.getElementById('fold-count').textContent = '12';

// Animate
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  
  const t = performance.now() * 0.001;
  
  // Subtle breathe
  auMat.emissiveIntensity += (0.2 + stage*0.08 - auMat.emissiveIntensity) * 0.05;
  
  // Sword glow pulse
  const swordGlow = 1 + Math.sin(t * 2) * 0.15;
  auMat.emissiveIntensity *= swordGlow;
  
  composer.render();
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
