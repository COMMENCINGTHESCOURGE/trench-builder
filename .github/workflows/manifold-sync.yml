name: Manifold Sync Daemon CI

on:
  schedule:
    - cron: '0 * * * *'  # Run hourly
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write

jobs:
  manifold-sync:

    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daemon One-Shot Sync
        run: |
          if (Test-Path "manifold_sync_daemon.py") {
              python manifold_sync_daemon.py --one-shot
          } else {
              Write-Output "manifold_sync_daemon.py not found in root. Simulating sync."
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add -A || true
              $status = git diff --cached --name-only
              if ($status) {
                  git commit -m "Automated sync: $(Get-Date)"
                  git pull --rebase
                  git push
              } else {
                  Write-Output "No changes to sync."
              }
          }
