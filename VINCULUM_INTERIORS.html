<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VINCULUM INTERIORS — Checkpoint Room Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a10;overflow:hidden;font-family:'Rajdhani',sans-serif}
#hud{position:absolute;top:12px;left:12px;z-index:10;pointer-events:none;color:#00d4ff;font-size:12px;letter-spacing:2px}
#hud .title{font-size:18px;font-weight:700;text-shadow:0 0 15px rgba(0,212,255,0.5)}
#hud .stage{color:#ffaa00;margin-top:4px}
#controls{position:absolute;bottom:12px;left:12px;z-index:10;color:#5a6b7f;font-size:10px}
#minimap{position:absolute;bottom:12px;right:12px;width:140px;height:140px;border:1px solid rgba(0,212,255,0.2);z-index:10}
#legend{position:absolute;top:12px;right:12px;z-index:10;font-size:9px;color:#5a6b7f;text-align:right;line-height:1.6}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
</style>
</head>
<body>
<div id="hud">
  <div class="title">VINCULUM INTERIORS</div>
  <div class="stage" id="stage-name">SUPINE — Bedroom</div>
  <div id="room-dims" style="font-size:10px;color:#5a6b7f;margin-top:4px;">12m × 10m × 4m</div>
</div>
<div id="legend">
  <div><span class="legend-dot" style="background:#00ff88"></span> DOOR (entry/exit)</div>
  <div><span class="legend-dot" style="background:#ffaa00"></span> LIGHT SOURCE</div>
  <div><span class="legend-dot" style="background:#ff2a4d"></span> COLLISION OBJ</div>
  <div><span class="legend-dot" style="background:#00d4ff"></span> NAVIGATION NODE</div>
  <div><span class="legend-dot" style="background:#aa66ff"></span> INTERACTIVE</div>
</div>
<div id="controls">←→ ARROWS: cycle rooms | MOUSE: orbit | SCROLL: zoom | R: reset view</div>
<canvas id="minimap" width="140" height="140"></canvas>

<!-- CDN: unpkg.com/jsdelivr. If CDN is down, vendor three.js locally: npm install three@0.160.0 and update paths. -->
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">

    ],

    ],

      { x: -5, y: 2.5, z: 0, w: 0.2, h: 5, d: 10 },

    ],
    props: [
      { type: 'cylinder', x: 0, z: 0, r: 1.5, h: 4, color: '#ff2244', tag: 'reactor_core' },
      { type: 'box', x: -3, z: 3, w: 2, h: 2, d: 1, color: '#445555', tag: 'coolant' },
      { type: 'box', x: 3, z: 3, w: 2, h: 2, d: 1, color: '#445555', tag: 'coolant' },
    ],
    doors: [{ x: 0, z: -5, w: 2.5, h: 4.5 }],
    navmesh: [[-4, -4], [4, -4], [4, 2], [2, 2], [2, 4], [-2, 4], [-2, 2], [-4, 2]],
    interactives: [{ type: 'circle', x: -3, z: 3, r: 0.5, color: '#aa66ff', tag: 'coolant_valve' }],
    description: 'Reactor engineering bay. Hot core in center. Coolant stations.'
  }
};

const STAGES = ['SUPINE','SCOOT','CRAWL','STAND','BOUNCE','WALK','JUMP','RUN'];

// ═══════════════════════════════════════
// THREE.JS SCENE
// ═══════════════════════════════════════
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a0a10');
scene.fog = new THREE.Fog('#0a0a10', 10, 50);

const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 200);
cam.position.set(10, 12, 18);
cam.lookAt(0, 1.5, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(cam, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.update();

scene.add(new THREE.AmbientLight('#334455', 0.6));
const dirLight = new THREE.DirectionalLight('#ffeedd', 1.2);
dirLight.position.set(10, 15, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(512, 512);
scene.add(dirLight);

let currentStage = 0;
const objects = [];
const minimap = document.getElementById('minimap');
const mmCtx = minimap.getContext('2d');

function buildRoom(stage) {
  objects.forEach(o => scene.remove(o));
  objects.length = 0;

  const room = ROOMS[stage];
  const { w, d, h } = room.dims;
  const chroma = room.chroma;

  // Floor
  const floorGeo = new THREE.PlaneGeometry(w + 0.1, d + 0.1);
  const floorMat = new THREE.MeshStandardMaterial({color:'#1a1a2e', roughness:0.9});
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -0.05;
  floor.receiveShadow = true;
  scene.add(floor);
  objects.push(floor);

  // Walls
  room.walls.forEach(wall => {
    const geo = new THREE.BoxGeometry(wall.w, wall.h, wall.d);
    const mat = new THREE.MeshStandardMaterial({
      color: '#2a2a3e',
      roughness: 0.85,
      transparent: true,
      opacity: 0.7
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(wall.x, wall.y, wall.z);
    mesh.receiveShadow = true;
    mesh.castShadow = true;
    scene.add(mesh);
    objects.push(mesh);
  });

  // Doors (cut out areas — rendered as different color)
  room.doors.forEach(door => {
    const geo = new THREE.BoxGeometry(door.w, door.h, 0.15);
    const mat = new THREE.MeshStandardMaterial({
      color: '#00ff88',
      roughness: 0.3,
      emissive: '#004422',
      emissiveIntensity: 0.5
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(door.x, door.h/2, door.z);
    mesh.receiveShadow = true;
    scene.add(mesh);
    objects.push(mesh);

    // Nav light above door
    const lightGeo = new THREE.SphereGeometry(0.1, 8, 8);
    const lightMat = new THREE.MeshBasicMaterial({color:'#00ff88'});
    const light = new THREE.Mesh(lightGeo, lightMat);
    light.position.set(door.x, door.h + 0.1, door.z);
    scene.add(light);
    objects.push(light);
  });

  // Props
  room.props.forEach(prop => {
    let geo, mat;
    if (prop.type === 'box') {
      geo = new THREE.BoxGeometry(prop.w, prop.h, prop.d);
    } else if (prop.type === 'cylinder') {
      geo = new THREE.CylinderGeometry(prop.r, prop.r, prop.h, 16);
    } else if (prop.type === 'sphere') {
      geo = new THREE.SphereGeometry(prop.r, 16, 16);
    }
    if (geo) {
      mat = new THREE.MeshStandardMaterial({
        color: prop.color,
        roughness: 0.6,
        transparent: prop.opacity ? true : false,
        opacity: prop.opacity || 1
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(prop.x, prop.type === 'box' ? prop.h/2 : (prop.type === 'cylinder' ? prop.h/2 : prop.r), prop.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      objects.push(mesh);

      // Tag label
      if (prop.tag) {
        const tagDiv = document.createElement('div');
        tagDiv.style.cssText = 'position:absolute;color:#aabbcc;font-size:8px;pointer-events:none;text-shadow:0 0 4px black;';
        tagDiv.textContent = prop.tag;
        tagDiv.className = 'tag-label';
        document.body.appendChild(tagDiv);
        objects.push({isTag:true, div:tagDiv, worldPos:new THREE.Vector3(prop.x, 3, prop.z)});
      }
    }
  });

  // Interactive hotspots
  room.interactives.forEach(inter => {
    const ringGeo = new THREE.RingGeometry(inter.r - 0.1, inter.r, 32);
    const ringMat = new THREE.MeshBasicMaterial({color: inter.color, side: THREE.DoubleSide, transparent: true, opacity: 0.5});
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI/2;
    ring.position.set(inter.x, 0.05, inter.z);
    ring.userData = {tag: inter.tag};
    ring.visible = true;
    scene.add(ring);
    objects.push(ring);
  });

  // Chroma light
  const chromaLight = new THREE.PointLight(
    `hsl(${chroma.hue}, 60%, ${chroma.light * 100}%)`,
    2, 20
  );
  chromaLight.position.set(0, room.dims.h - 0.5, 0);
  scene.add(chromaLight);
  objects.push(chromaLight);

  // Update HUD
  document.getElementById('stage-name').textContent = room.name;
  document.getElementById('room-dims').textContent = 
    `${room.dims.w}m × ${room.dims.d}m × ${room.dims.h}m | mod9=${room.mod9} | ${room.chroma.hue}°`;

  // Minimap
  drawMinimap(room);
}

function drawMinimap(room) {
  mmCtx.fillStyle = '#0a0a10';
  mmCtx.fillRect(0, 0, 140, 140);

  const scale = 130 / Math.max(room.dims.w, room.dims.d);
  const ox = 70 - room.dims.w * scale / 2;
  const oy = 70 - room.dims.d * scale / 2;

  mmCtx.fillStyle = '#1a1a2e';
  mmCtx.fillRect(ox, oy, room.dims.w * scale, room.dims.d * scale);

  room.doors.forEach(door => {
    mmCtx.fillStyle = '#00ff88';
    const dx = door.x + room.dims.w/2;
    const dz = door.z + room.dims.d/2;
    mmCtx.fillRect(ox + dx * scale - door.w*scale/2, oy + dz * scale - 1, door.w * scale, 2);
  });

  room.props.forEach(prop => {
    mmCtx.fillStyle = prop.tag === 'bed' || prop.tag === 'hologram_table' ? '#445566' : '#ff2a4d';
    const px = prop.x + room.dims.w/2;
    const pz = prop.z + room.dims.d/2;
    mmCtx.fillRect(ox + px * scale - 3, oy + pz * scale - 3, 6, 6);
  });

  room.interactives.forEach(inter => {
    mmCtx.fillStyle = '#aa66ff';
    const ix = inter.x + room.dims.w/2;
    const iz = inter.z + room.dims.d/2;
    mmCtx.beginPath();
    mmCtx.arc(ox + ix * scale, oy + iz * scale, 3, 0, Math.PI*2);
    mmCtx.fill();
  });
}

// ═══════════════════════════════════
// ANIMATION
// ═══════════════════════════════════
buildRoom('SUPINE');

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') {
    currentStage = (currentStage + 1) % STAGES.length;
    buildRoom(STAGES[currentStage]);
  }
  if (e.key === 'ArrowLeft') {
    currentStage = (currentStage - 1 + STAGES.length) % STAGES.length;
    buildRoom(STAGES[currentStage]);
  }
  if (e.key === 'r' || e.key === 'R') {
    cam.position.set(10, 12, 18);
    controls.target.set(0, 1.5, 0);
    controls.update();
    buildRoom(STAGES[currentStage]);
  }
});

function updateTagLabels() {
  objects.forEach(obj => {
    if (obj.isTag && obj.div) {
      const pos = obj.worldPos.clone().project(cam);
      const x = (pos.x * 0.5 + 0.5) * innerWidth;
      const y = (-pos.y * 0.5 + 0.5) * innerHeight;
      if (pos.z < 1) {
        obj.div.style.left = x + 'px';
        obj.div.style.top = y + 'px';
        obj.div.style.display = 'block';
      } else {
        obj.div.style.display = 'none';
      }
    }
  });
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updateTagLabels();
  renderer.render(scene, cam);
}
animate();

window.addEventListener('resize', () => {
  cam.aspect = innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
