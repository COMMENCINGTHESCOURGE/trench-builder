<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BACKROOMS MEP — Liminal Infrastructure</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;cursor:grab}
body:active{cursor:grabbing}
#hud{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);color:#8899aa;font:10px 'Courier New',monospace;background:rgba(0,0,0,.8);padding:5px 14px;border:1px solid #334455;border-radius:3px;pointer-events:none;z-index:10;display:flex;gap:16px}
#info{position:fixed;top:10px;left:10px;color:#778899;font:9px 'Courier New',monospace;background:rgba(0,0,0,.8);padding:8px 12px;border:1px solid #334455;border-radius:3px;pointer-events:none;z-index:10;line-height:1.5}
#info b{color:#99aabb}
</style>
</head>
<body>
<div id="info">
<b>BACKROOMS MEP</b> — Liminal Infrastructure<br>
Electrical · HVAC · Plumbing · Switches · Junction Boxes<br>
<span style="color:#556677">Cold clinical palette — no tobacco residue</span>
</div>
<div id="hud">
<span id="fps">60 FPS</span>
<span>WASD: move</span>
<span>Mouse: look</span>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';

const W=innerWidth,H=innerHeight,
$=id=>document.getElementById(id);

// ═══════════════════════════════════════
// SCENE — Cold clinical liminal
// ═══════════════════════════════════════
const S=new THREE.Scene();
S.background=new THREE.Color(0x1a1f24); // dark blue-gray, not yellow
S.fog=new THREE.FogExp2(0x1a1f24,0.003);

const cam=new THREE.PerspectiveCamera(70,W/H,.1,200);
cam.position.set(0,1.7,5);

const R=new THREE.WebGLRenderer({antialias:true});
R.setSize(W,H);R.setPixelRatio(Math.min(devicePixelRatio,2));
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.1;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);

// ── Lighting: cold fluorescent, harsh ──
S.add(new THREE.AmbientLight(0x334455,0.4));
const overhead=new THREE.PointLight(0xaaccdd,8,15,1.5);
overhead.position.set(0,3.5,0);overhead.castShadow=true;
overhead.shadow.mapSize.set(1024,1024);
S.add(overhead);
// Subtle fill from side corridor
S.add(new THREE.PointLight(0x8899aa,3,8,2)).position.set(4,2.5,-2);

// ═══════════════════════════════════════
// MEP INFRASTRUCTURE BUILDER
// ═══════════════════════════════════════

const wallMat=new THREE.MeshPhysicalMaterial({color:0xc8ccd0,roughness:.85,metalness:.02,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }); // pale gray, not yellow
const floorMat=new THREE.MeshPhysicalMaterial({color:0x889094,roughness:.7,metalness:.05,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });
const ceilMat=new THREE.MeshPhysicalMaterial({color:0x9ba4a8,roughness:.9,metalness:.02,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });
const metalMat=new THREE.MeshPhysicalMaterial({color:0x8899aa,metalness:.85,roughness:.25,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });
const copperMat=new THREE.MeshPhysicalMaterial({color:0xcc8844,metalness:.95,roughness:.2,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });
const plasticMat=new THREE.MeshPhysicalMaterial({color:0xdde0e4,roughness:.5,metalness:.05,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });
const ventMat=new THREE.MeshPhysicalMaterial({color:0x99aabb,metalness:.7,roughness:.35,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });
const glassMat=new THREE.MeshPhysicalMaterial({color:0xccdde8,roughness:.1,metalness:.2,transparent:true,opacity:.4,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });

function box(w,h,d,mat,castShadow=true){
  const g=new THREE.BoxGeometry(w,h,d);
  const m=new THREE.Mesh(g,mat);m.castShadow=castShadow;m.receiveShadow=true;return m;
}

// ── Walls ──
function makeWall(x,y,z,w,h,d,mat=wallMat){
  return Object.assign(box(w,h,d,mat),{position:new THREE.Vector3(x,y,z)});
}

// Ceiling panels
for(let x=-6;x<=6;x+=2.5)for(let z=-6;z<=6;z+=2.5)
  S.add(makeWall(x,3.5,z-1.25,2.4,.05,2.4,ceilMat));

// Floor tiles
for(let x=-6;x<=6;x+=2)for(let z=-6;z<=6;z+=2)
  S.add(makeWall(x,0,z-1,1.9,.03,1.9,floorMat));


// ═══════════════════════════════════════
// ELECTRICAL RECEPTACLES (outlets)
// ═══════════════════════════════════════
function makeOutlet(x,y,z,rotY=0){
  const g=new THREE.Group();
  // Faceplate
  const plate=box(.22,.005,.28,plasticMat,false);plate.position.set(0,0,0);g.add(plate);
  // Top socket
  const s1=box(.06,.01,.08,new THREE.MeshPhysicalMaterial({color:0x334455,roughness:.3,metalness:.6,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }),false);s1.position.set(-.04,.003,.04);g.add(s1);
  // Bottom socket
  const s2=box(.06,.01,.08,new THREE.MeshPhysicalMaterial({color:0x334455,roughness:.3,metalness:.6,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }),false);s2.position.set(-.04,.003,-.04);g.add(s2);
  // Screw
  const screw=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.005,8),metalMat);screw.position.set(.08,.003,0);g.add(screw);
  g.position.set(x,y,z);g.rotation.y=rotY;return g;
}

// ── Outlets along corridor walls ──
for(let z=-5;z<=5;z+=3){
  S.add(makeOutlet(-3.5,.8,z,Math.PI/2));  // left wall
  S.add(makeOutlet(3.5,.8,z,-Math.PI/2));  // right wall
}
S.add(makeOutlet(-3.5,1.5,0,Math.PI/2)); // outlet near floor
S.add(makeOutlet(3.5,1.5,0,-Math.PI/2));

// ═══════════════════════════════════════
// LIGHT SWITCHES
// ═══════════════════════════════════════
function makeSwitch(x,y,z,rotY=0){
  const g=new THREE.Group();
  const plate=box(.16,.005,.24,plasticMat,false);plate.position.set(0,0,0);g.add(plate);
  // Toggle
  const toggle=box(.03,.015,.08,new THREE.MeshPhysicalMaterial({color:0xdde0e4,roughness:.4,metalness:.1,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }),false);
  toggle.position.set(0,.008,0);g.add(toggle);
  // Screws
  const s1=new THREE.Mesh(new THREE.CylinderGeometry(.006,.006,.004,8),metalMat);s1.position.set(0,.003,.08);g.add(s1);
  const s2=new THREE.Mesh(new THREE.CylinderGeometry(.006,.006,.004,8),metalMat);s2.position.set(0,.003,-.08);g.add(s2);
  g.position.set(x,y,z);g.rotation.y=rotY;return g;
}

for(let z=-4;z<=4;z+=4){
  S.add(makeSwitch(-3.5,1.3,z,Math.PI/2));
  S.add(makeSwitch(3.5,1.3,z,-Math.PI/2));
}

// ═══════════════════════════════════════
// JUNCTION BOXES
// ═══════════════════════════════════════
function makeJunctionBox(x,y,z){
  const g=new THREE.Group();
  const body=box(.3,.25,.3,new THREE.MeshPhysicalMaterial({color:0x667788,metalness:.8,roughness:.3,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }),false);
  body.position.set(0,.12,0);g.add(body);
  // Knockouts (circular punch-outs)
  for(let i=0;i<4;i++){
    const ko=new THREE.Mesh(new THREE.TorusGeometry(.04,.008,8,16),metalMat);
    ko.position.set(0,.18,0);ko.rotation.x=Math.PI/2;
    ko.position.x=Math.cos(i*Math.PI/2)*.15;
    ko.position.z=Math.sin(i*Math.PI/2)*.15;
    g.add(ko);
  }
  // Conduit stub
  const stub=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.4,8),metalMat);
  stub.position.set(0,.35,0);g.add(stub);
  g.position.set(x,y,z);return g;
}

S.add(makeJunctionBox(-3.3,.7,-3));
S.add(makeJunctionBox(3.3,.7,3));
S.add(makeJunctionBox(-3.3,2.8,-3));

// ═══════════════════════════════════════
// THERMOSTAT
// ═══════════════════════════════════════
function makeThermostat(x,y,z,rotY=0){
  const g=new THREE.Group();
  const body=box(.22,.005,.3,plasticMat,false);body.position.set(0,0,0);g.add(body);
  // Screen
  const screen=box(.14,.003,.1,new THREE.MeshPhysicalMaterial({color:0x334455,roughness:.1,emissive:0x111122,emissiveIntensity:.3,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }),false);
  screen.position.set(0,.003,.04);g.add(screen);
  // Display digits (tiny boxes pretending to be LCD segments)
  for(let i=0;i<3;i++){
    const seg=box(.02,.001,.005,new THREE.MeshPhysicalMaterial({color:0x88aacc,emissive:0x446688,emissiveIntensity:.5,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }),false);
    seg.position.set(-.03+i*.03,.003,.03);g.add(seg);
  }
  g.position.set(x,y,z);g.rotation.y=rotY;return g;
}

S.add(makeThermostat(-3.5,1.5,3,Math.PI/2));
S.add(makeThermostat(3.5,1.5,-3,-Math.PI/2));

// ═══════════════════════════════════════
// HVAC VENTS (supply + return)
// ═══════════════════════════════════════
function makeVent(x,y,z,rotX=0,rotZ=0,size=.6){
  const g=new THREE.Group();
  const frame=box(size,.04,.3,ventMat,false);frame.position.set(0,0,0);g.add(frame);
  // Louvers
  for(let i=0;i<6;i++){
    const fin=box(.02,.005,size-.08,new THREE.MeshPhysicalMaterial({color:0xaabbcc,metalness:.6,roughness:.3,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }),false);
    fin.position.set(0,0,-.1+i*.04);fin.rotation.x=.3;g.add(fin);
  }
  g.position.set(x,y,z);g.rotation.x=rotX;g.rotation.z=rotZ;return g;
}

// Ceiling vents
S.add(makeVent(0,3.4,-3,0,0,.8));
S.add(makeVent(-2,3.4,2,0,0,.6));
S.add(makeVent(3,3.4,-1,0,0,.7));
// Wall return vent
S.add(makeVent(-3.3,1.8,0,0,-Math.PI/2,.5));

// ═══════════════════════════════════════
// DOORS (with frame + handle)
// ═══════════════════════════════════════
function makeDoorway(x,y,z,rotY=0){
  const g=new THREE.Group();
  // Frame
  const leftJamb=box(.08,2.4,.15,metalMat,false);leftJamb.position.set(-.5,1.2,0);g.add(leftJamb);
  const rightJamb=box(.08,2.4,.15,metalMat,false);rightJamb.position.set(.5,1.2,0);g.add(rightJamb);
  const header=box(1.08,.08,.15,metalMat,false);header.position.set(0,2.4,0);g.add(header);
  // Door (slightly open)
  const door=box(.9,2.3,.04,new THREE.MeshPhysicalMaterial({color:0x445566,roughness:.4,metalness:.3,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }),false);
  door.position.set(.42,1.15,.1);door.rotation.y=.3;g.add(door);
  // Handle
  const handle=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.12,8),metalMat);
  handle.position.set(.8,1.15,.1);handle.rotation.x=Math.PI/2;g.add(handle);
  g.position.set(x,y,z);g.rotation.y=rotY;return g;
}

S.add(makeDoorway(0,.05,-5.9,0));   // far end
S.add(makeDoorway(-5.9,.05,2,Math.PI/2)); // left side

// ═══════════════════════════════════════
// BASEBOARDS — Floor-wall junction trim
// ═══════════════════════════════════════
const baseMat=new THREE.MeshPhysicalMaterial({color:0xbcc0c4,roughness:.6,metalness:.05,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });

function makeBaseboard(x,y,z,length,rotY=0){
  const g=new THREE.Group();
  // Main board
  g.add(Object.assign(box(length,.12,.03,baseMat),{position:new THREE.Vector3(0,.06,0)}));
  // Top cap (slightly proud)
  g.add(Object.assign(box(length,.015,.04,baseMat),{position:new THREE.Vector3(0,.12,0)}));
  g.position.set(x,y,z);g.rotation.y=rotY;return g;
}

// Left wall baseboard
S.add(makeBaseboard(-3.57,.06,0,12,0));
// Right wall baseboard
S.add(makeBaseboard(3.57,.06,0,12,0));
// Back wall baseboard
S.add(makeBaseboard(0,.06,-5.95,7.2,0));
// Front wall baseboard (near door)
S.add(makeBaseboard(0,.06,5.95,3,0));
S.add(makeBaseboard(2.5,.06,5.95,2,0));
S.add(makeBaseboard(-2.5,.06,5.95,2,0));

// ═══════════════════════════════════════
// CROWN MOLDING — Ceiling-wall junction
// ═══════════════════════════════════════
const crownMat=new THREE.MeshPhysicalMaterial({color:0xc8ccd0,roughness:.5,metalness:.08,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });

function makeCrown(x,y,z,length,rotY=0){
  const g=new THREE.Group();
  // Main crown body
  g.add(Object.assign(box(length,.08,.06,crownMat),{position:new THREE.Vector3(0,3.48,0)}));
  // Bottom detail ledge
  g.add(Object.assign(box(length,.015,.08,crownMat),{position:new THREE.Vector3(0,3.44,0)}));
  // Top cove curve (approximated with small boxes)
  for(let i=0;i<4;i++){
    g.add(Object.assign(box(length,.01,.02,crownMat),{position:new THREE.Vector3(0,3.5+i*.01,.02+i*.005)}));
  }
  g.position.set(x,y,z);g.rotation.y=rotY;return g;
}

S.add(makeCrown(-3.57,0,0,12,0));
S.add(makeCrown(3.57,0,0,12,0));
S.add(makeCrown(0,0,-5.95,7.2,0));
S.add(makeCrown(0,0,5.95,3,0));
S.add(makeCrown(2.5,0,5.95,2,0));
S.add(makeCrown(-2.5,0,5.95,2,0));

// ═══════════════════════════════════════
// RUNWAY RUGS — Long corridor runners
// ═══════════════════════════════════════
const rugMat=new THREE.MeshPhysicalMaterial({color:0x334455,roughness:.95,metalness:.02,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });

function makeRug(x,z,length,color=null){
  const mat=color||rugMat;
  const g=new THREE.BoxGeometry(.8,.004,length);
  const m=new THREE.Mesh(g,mat);
  m.position.set(x,.053,z);m.receiveShadow=true;return m;
}

// Three staggered runway rugs down the corridor
S.add(makeRug(-1.2,-4,5,new THREE.MeshPhysicalMaterial({color:0x2a3a4a,roughness:.95,metalness:.02,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    })));
S.add(makeRug(1.2,1,6,new THREE.MeshPhysicalMaterial({color:0x3a4a5a,roughness:.95,metalness:.02,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    })));
S.add(makeRug(-.8,4,3,new THREE.MeshPhysicalMaterial({color:0x253545,roughness:.95,metalness:.02,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    })));

// ═══════════════════════════════════════
// FURNITURE — Liminal office pieces
// ═══════════════════════════════════════

// ── DESK ──
function makeDesk(x,y,z,rotY=0){
  const g=new THREE.Group();
  const deskMat2=new THREE.MeshPhysicalMaterial({color:0x556677,roughness:.4,metalness:.3,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });
  // Top
  g.add(Object.assign(box(1.4,.04,.7,deskMat2),{position:new THREE.Vector3(0,.75,0)}));
  // Legs
  for(let lx of [-.65,.65])for(let lz of [-.3,.3]){
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.73,8),metalMat),{position:new THREE.Vector3(lx,.38,lz)}));
  }
  // Modesty panel
  g.add(Object.assign(box(1.3,.5,.03,deskMat2),{position:new THREE.Vector3(0,.25,-.33)}));
  g.position.set(x,y,z);g.rotation.y=rotY;return g;
}

// ── OFFICE CHAIR ──
function makeChair(x,y,z,rotY=0){
  const g=new THREE.Group();
  const chairMat2=new THREE.MeshPhysicalMaterial({color:0x334455,roughness:.5,metalness:.2,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });
  // Seat
  g.add(Object.assign(box(.4,.05,.4,chairMat2),{position:new THREE.Vector3(0,.48,0)}));
  // Backrest
  g.add(Object.assign(box(.38,.35,.04,chairMat2),{position:new THREE.Vector3(0,.68,-.18)}));
  // Base + stem
  g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.44,8),metalMat),{position:new THREE.Vector3(0,.24,0)}));
  // Caster base (5 spokes)
  for(let i=0;i<5;i++){
    const a=i/5*Math.PI*2;
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.01,.01,.2,6),metalMat),{position:new THREE.Vector3(Math.cos(a)*.15,.06,Math.sin(a)*.15),rotation:{x:0,y:0,z:Math.PI/2}}));
  }
  // Casters
  for(let i=0;i<5;i++){
    const a=i/5*Math.PI*2;
    g.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(.025,8,6),new THREE.MeshPhysicalMaterial({color:0x222222,roughness:.3,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    })),{position:new THREE.Vector3(Math.cos(a)*.25,.025,Math.sin(a)*.25)}));
  }
  g.position.set(x,y,z);g.rotation.y=rotY;return g;
}

// ── FLOOR LAMP ──
function makeLamp(x,y,z){
  const g=new THREE.Group();
  // Base
  g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.15,.18,.04,16),metalMat),{position:new THREE.Vector3(0,.02,0)}));
  // Pole
  g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,1.5,8),metalMat),{position:new THREE.Vector3(0,.8,0)}));
  // Shade (cone)
  g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.05,.25,.3,16,1,true),new THREE.MeshPhysicalMaterial({color:0xdde0e4,roughness:.4,metalness:.1,side:THREE.DoubleSide,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    })),{position:new THREE.Vector3(0,1.6,0)}));
  // Bulb glow
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(.04,8,6),new THREE.MeshPhysicalMaterial({color:0xffeedd,emissive:0xffddaa,emissiveIntensity:.4,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    }));
  bulb.position.set(0,1.5,0);g.add(bulb);
  g.position.set(x,y,z);return g;
}

// ── FILING CABINET ──
function makeCabinet(x,y,z,rotY=0){
  const g=new THREE.Group();
  const cabMat=new THREE.MeshPhysicalMaterial({color:0x667788,roughness:.3,metalness:.4,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    });
  g.add(Object.assign(box(.4,.8,.5,cabMat),{position:new THREE.Vector3(0,.4,0)}));
  // Drawer fronts
  for(let i=0;i<3;i++){
    g.add(Object.assign(box(.36,.22,.02,new THREE.MeshPhysicalMaterial({color:0x778899,roughness:.3,metalness:.4,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.3,
        thickness: 0.5
    })),{position:new THREE.Vector3(0,.18+i*.25,.26)}));
    // Handle
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.1,8),metalMat),{position:new THREE.Vector3(0,.18+i*.25,.28),rotation:{x:Math.PI/2,y:0,z:0}}));
  }
  g.position.set(x,y,z);g.rotation.y=rotY;return g;
}

// Place furniture — sparse, unsettling
S.add(makeDesk(-2.2,.05,-3,0));           // Left wall desk
S.add(makeChair(-2.2,.05,-2.3,-.3));      // Chair pulled out slightly
S.add(makeLamp(-2.5,.05,-2.5));            // Floor lamp beside desk
S.add(makeCabinet(-3,.05,-3.5,0));         // Filing cabinet

S.add(makeDesk(2.2,.05,1,Math.PI));        // Right wall desk (facing opposite)
S.add(makeChair(2.2,.05,.3,Math.PI-.3));   // Chair
S.add(makeCabinet(3,.05,1.5,0));           // Cabinet
function makeConduit(start,end){
  const dx=end.x-start.x,dy=end.y-start.y,dz=end.z-start.z;
  const length=Math.sqrt(dx*dx+dy*dy+dz*dz);
  const mid={x:(start.x+end.x)/2,y:(start.y+end.y)/2,z:(start.z+end.z)/2};
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,length,8,1),metalMat);
  cyl.position.set(mid.x,mid.y,mid.z);
  // Rotate to align with direction
  cyl.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    new THREE.Vector3(dx,dy,dz).normalize()
  );
  cyl.castShadow=true;return cyl;
}

// Surface conduit along walls
S.add(makeConduit({x:-3.4,y:2.5,z:-4},{x:-3.4,y:1,z:0}));
S.add(makeConduit({x:3.4,y:2.5,z:-4},{x:3.4,y:1,z:0}));
S.add(makeConduit({x:-3.4,y:2.8,z:-3},{x:0,y:3.3,z:-3})); // up to ceiling

// ═══════════════════════════════════════
// CORRIDOR WALLS (the space itself)
// ═══════════════════════════════════════
// Long corridor
S.add(makeWall(0,1.75,-6,7.2,3.5,.1));    // back wall
S.add(makeWall(-3.6,1.75,0,.1,3.5,12));   // left wall
S.add(makeWall(3.6,1.75,0,.1,3.5,12));    // right wall
S.add(makeWall(0,.05,0,7.2,.1,12,floorMat)); // floor
S.add(makeWall(0,3.55,0,7.2,.1,12,ceilMat)); // ceiling

// ═══════════════════════════════════════
// FPS + CAMERA
// ═══════════════════════════════════════
const keys={};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// Mouse look
let yaw=Math.PI,pitch=0;
let mouseDown=false;
window.addEventListener('mousedown',()=>mouseDown=true);
window.addEventListener('mouseup',()=>mouseDown=false);
window.addEventListener('mousemove',e=>{
  if(!mouseDown)return;
  yaw-=e.movementX*.003;
  pitch=Math.max(-1.2,Math.min(.5,pitch-e.movementY*.003));
});

let fc=0,lt=0;

function loop(){
  requestAnimationFrame(loop);
  const dt=.016,t=performance.now()*.001;

  // Movement
  const speed=4*dt;
  const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));

  if(keys['w']){cam.position.addScaledVector(fwd,speed)}
  if(keys['s']){cam.position.addScaledVector(fwd,-speed)}
  if(keys['a']){cam.position.addScaledVector(right,-speed)}
  if(keys['d']){cam.position.addScaledVector(right,speed)}

  // Clamp to corridor
  cam.position.x=Math.max(-3.2,Math.min(3.2,cam.position.x));
  cam.position.z=Math.max(-5.5,Math.min(5.5,cam.position.z));
  cam.position.y=Math.max(1.2,Math.min(3,cam.position.y));

  // Look
  const lookTarget=new THREE.Vector3(
    cam.position.x-Math.sin(yaw)*Math.cos(pitch)*3,
    cam.position.y+Math.sin(pitch)*3,
    cam.position.z-Math.cos(yaw)*Math.cos(pitch)*3
  );
  cam.lookAt(lookTarget);

  R.render(S,cam);

  // FPS
  fc++;if(t-lt>.5){$('fps').textContent=`${Math.round(fc/(t-lt))} FPS`;fc=0;lt=t}
}

window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
loop();

console.log('BACKROOMS MEP — Cold clinical liminal with infrastructure');
console.log('Receptacles · Switches · Junction Boxes · Thermostats · Vents · Conduit · Doors');
</script>
