<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';

// ═══════════════════════════════════════════════════════════════
// TRENCH BUILDER v4 — Hyperreal Rendering Pipeline
// Principles from the 22-point rendering theory document
// ═══════════════════════════════════════════════════════════════

const W=innerWidth,H=innerHeight,$=id=>document.getElementById(id);

// ── Renderer ──
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
R.setSize(W,H);R.setPixelRatio(Math.min(devicePixelRatio,2));
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.15;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(R.domElement);

// ── Effect Composer (for post-processing) ──
const composer=new EffectComposer(R);
const renderPass=new RenderPass(R.domElement);
composer.addPass(renderPass);

// ═══════════════════════════════════════════
// SECTION 13: FILM GRAIN — "Clean images feel fake"
// ═══════════════════════════════════════════
const grainShader={
  uniforms:{tDiffuse:{value:null},time:{value:0},intensity:{value:0.04}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform float time, intensity;
    varying vec2 vUv;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    void main(){
      vec4 col=texture2D(tDiffuse,vUv);
      float grain=hash(vUv+time)*intensity;
      col.rgb+=grain*(0.5-col.rgb)*2.0;
      gl_FragColor=col;
    }`
};
const grainPass=new ShaderPass(grainShader);grainPass.enabled=false;composer.addPass(grainPass);

// ═══════════════════════════════════════════
// SECTION 16: VOLUMETRIC GOD RAYS
// ═══════════════════════════════════════════
const godRaysShader={
  uniforms:{tDiffuse:{value:null},time:{value:0},sunPos:{value:new THREE.Vector2(.5,.3)},intensity:{value:.25}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform float time,intensity;uniform vec2 sunPos;
    varying vec2 vUv;
    void main(){
      vec4 col=texture2D(tDiffuse,vUv);
      vec2 delta=vUv-sunPos;
      float dist=length(delta);
      float ray=exp(-dist*3.5)*intensity*smoothstep(.15,.0,dist);
      col.rgb+=vec3(1.0,.9,.7)*ray*.35;
      gl_FragColor=col;
    }`
};
const godRaysPass=new ShaderPass(godRaysShader);godRaysPass.enabled=false;composer.addPass(godRaysPass);

// ═══════════════════════════════════════════
// SECTION 2: AMBIENT OCCLUSION (faux GI)
// ═══════════════════════════════════════════
const aoShader={
  uniforms:{tDiffuse:{value:null},tDepth:{value:null},intensity:{value:.4}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform float intensity;
    varying vec2 vUv;
    void main(){
      vec4 col=texture2D(tDiffuse,vUv);
      float ao=1.0;
      for(float x=-2.;x<=2.;x++)for(float y=-2.;y<=2.;y++){
        vec2 off=vUv+vec2(x,y)/800.;
        vec4 s=texture2D(tDiffuse,off);
        ao-=length(col.rgb-s.rgb)*.015*intensity;
      }
      col.rgb*=clamp(ao,.4,1.);
      gl_FragColor=col;
    }`
};
const aoPass=new ShaderPass(aoShader);aoPass.enabled=false;composer.addPass(aoPass);

// ═══════════════════════════════════════════
// SCENE
// ═══════════════════════════════════════════
const S=new THREE.Scene();
S.fog=new THREE.FogExp2(0x000010,0.002);
S.background=new THREE.Color(0x060812);

const cam=new THREE.PerspectiveCamera(50,W/H,.1,120);
cam.position.set(12,10,14);cam.lookAt(0,0,0);
const ctrl=new OrbitControls(cam,R.domElement);
ctrl.target.set(0,.3,0);ctrl.enableDamping=true;ctrl.dampingFactor=.06;
ctrl.minDistance=1.5;ctrl.maxDistance=60;ctrl.maxPolarAngle=Math.PI*.48;ctrl.update();

// ── Topography terrain ──
const TS=50,TR=100;const hd=new Float32Array(TR*TR);
for(let i=0;i<TR;i++)for(let j=0;j<TR;j++){
  const x=(i/TR-.5)*TS*2,z=(j/TR-.5)*TS*2,d=Math.sqrt(x*x+z*z);
  hd[i*TR+j]=Math.sin(x*.15+z*.1)*1.5+Math.cos(x*.3-z*.25)*.8+Math.sin(x*.6)*Math.cos(z*.55)*.4+Math.exp(-d*d*.002)*2.5+Math.sin(x*.05+z*.08)*3+Math.sin(z*.04)*2;
}
const tGeo=new THREE.PlaneGeometry(TS,TS,TR-1,TR-1);tGeo.rotateX(-Math.PI/2);
const pos=tGeo.attributes.position;
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i),z=pos.getZ(i),ix=Math.floor((x/TS+.5)*(TR-1)),iz=Math.floor((z/TS+.5)*(TR-1));
  pos.setY(i,hd[Math.max(0,Math.min(TR-1,ix))*TR+Math.max(0,Math.min(TR-1,iz))]);
}
tGeo.computeVertexNormals();
const cs=[[0,[.08,.15,.06]],[.15,[.15,.22,.08]],[.35,[.25,.28,.12]],[.55,[.35,.30,.18]],[.75,[.45,.38,.25]],[.9,[.55,.45,.32]],[1,[.7,.65,.55]]];
const clrs=new Float32Array(pos.count*3);
for(let i=0;i<pos.count;i++){
  const h=pos.getY(i),nh=Math.max(0,Math.min(1,(h+6)/14));
  let c=[0,0,0];
  for(let s=0;s<cs.length-1;s++)if(nh>=cs[s][0]&&nh<=cs[s+1][0]){const t=(nh-cs[s][0])/(cs[s+1][0]-cs[s][0]);for(let k=0;k<3;k++)c[k]=cs[s][1][k]+(cs[s+1][1][k]-cs[s][1][k])*t;break}
  clrs[i*3]=c[0];clrs[i*3+1]=c[1];clrs[i*3+2]=c[2];
}
tGeo.setAttribute('color',new THREE.BufferAttribute(clrs,3));
S.add(new THREE.Mesh(tGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.8,metalness:.02,flatShading:true}))).receiveShadow=true;

// Contour
const contourG=new THREE.Group();contourG.visible=false;S.add(contourG);
for(let l=-5;l<=7;l+=.5){const pts=[];for(let i=0;i<TR;i++)for(let j=0;j<TR;j++)if(Math.abs(hd[i*TR+j]-l)<.15)pts.push(new THREE.Vector3((i/(TR-1)-.5)*TS,l+.02,(j/(TR-1)-.5)*TS));if(pts.length>2)contourG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff,opacity:.25,transparent:true})))}

function hAt(x,z){const ix=Math.floor((x/TS+.5)*(TR-1)),iz=Math.floor((z/TS+.5)*(TR-1));return hd[Math.max(0,Math.min(TR-1,ix))*TR+Math.max(0,Math.min(TR-1,iz))]}

// Grid
S.add(new THREE.GridHelper(TS,TS,0x221100,0x110804)).position.y=.005;

// ── Lighting ──
const sun=new THREE.DirectionalLight(0xffeedd,3.8);sun.position.set(15,20,10);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1;sun.shadow.camera.far=100;
sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;sun.shadow.bias=-.00003;
S.add(sun);S.add(new THREE.AmbientLight(0x221111,.45));S.add(new THREE.HemisphereLight(0x8899cc,0x332211,.25));

// ═══════════════════════════════════════════
// AVATAR + SECTION 14: MECHANICAL PHYSICS
// ═══════════════════════════════════════════
const AV=new THREE.Group();AV.position.set(0,hAt(0,0),0);
const avPhys={mass:80,vx:0,vy:0,ax:0,ay:0,inertia:.92,damping:.85};

function faceForge(r=.35,segs=36){
  const g=new THREE.SphereGeometry(r,segs,segs),p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i),l=Math.sqrt(x*x+y*y+z*z);
    const nx=x/l,ny=y/l,nz=z/l,f=Math.max(0,nz);
    const eL=Math.hypot(nx-.12,ny-.08)*6,eR=Math.hypot(nx+.12,ny-.08)*6;
    p.setXYZ(i,x*(l+((Math.exp(-eL*eL)+Math.exp(-eR*eR))*.04*f+(Math.exp(-(nx*nx+(ny-.02)*(ny-.02))*20)*.06*f-Math.exp(-(nx*nx+(ny+.3)*(ny+.3))*12)*.08*f-Math.exp(-(nx*nx+(ny+.45)*(ny+.45))*25)*.015*f+(Math.exp(-((nx-.12)*(nx-.12)*15+(ny-.18)*(ny-.18)*15))+Math.exp(-((nx+.12)*(nx+.12)*15+(ny-.18)*(ny-.18)*15)))*.025*f)*.5))/l,y*(l+((Math.exp(-eL*eL)+Math.exp(-eR*eR))*.04*f+(Math.exp(-(nx*nx+(ny-.02)*(ny-.02))*20)*.06*f-Math.exp(-(nx*nx+(ny+.3)*(ny+.3))*12)*.08*f-Math.exp(-(nx*nx+(ny+.45)*(ny+.45))*25)*.015*f+(Math.exp(-((nx-.12)*(nx-.12)*15+(ny-.18)*(ny-.18)*15))+Math.exp(-((nx+.12)*(nx+.12)*15+(ny-.18)*(ny-.18)*15)))*.025*f)*.5))/l,z*(l+((Math.exp(-eL*eL)+Math.exp(-eR*eR))*.04*f+(Math.exp(-(nx*nx+(ny-.02)*(ny-.02))*20)*.06*f-Math.exp(-(nx*nx+(ny+.3)*(ny+.3))*12)*.08*f-Math.exp(-(nx*nx+(ny+.45)*(ny+.45))*25)*.015*f+(Math.exp(-((nx-.12)*(nx-.12)*15+(ny-.18)*(ny-.18)*15))+Math.exp(-((nx+.12)*(nx+.12)*15+(ny-.18)*(ny-.18)*15)))*.025*f)*.5))/l);
  }
  g.computeVertexNormals();return g;
}

const skin=new THREE.MeshPhysicalMaterial({color:new THREE.Color('#1E130B'),roughness:.3,metalness:.02,specularIntensity:1.5,specularColor:new THREE.Color('#ffccaa'),clearcoat:.2,clearcoatRoughness:.45,sheen:.15,sheenRoughness:.6,sheenColor:new THREE.Color('#cc8866'),transmission:.02,thickness:.2});
AV.add(new THREE.Mesh(faceForge(),skin)).position.y=1.58;
AV.add(new THREE.Mesh(new THREE.CylinderGeometry(.18,.15,.6,20),skin)).position.y=.88;
const aL=new THREE.Mesh(new THREE.CylinderGeometry(.05,.045,.5,12),skin);aL.position.set(-.22,1.05,0);aL.rotation.z=.4;AV.add(aL);
const aR=new THREE.Mesh(new THREE.CylinderGeometry(.05,.045,.5,12),skin);aR.position.set(.22,1.05,0);aR.rotation.z=-.4;AV.add(aR);
AV.add(new THREE.Mesh(new THREE.CylinderGeometry(.06,.055,.55,12),skin)).position.set(-.08,.35,0);
AV.add(new THREE.Mesh(new THREE.CylinderGeometry(.06,.055,.55,12),skin)).position.set(.08,.35,0);
const hM=new THREE.MeshStandardMaterial({color:0xff8800,roughness:.35});
AV.add(new THREE.Mesh(new THREE.SphereGeometry(.2,20,14,0,Math.PI*2,0,Math.PI*.5),hM)).position.y=1.81;
const gled=new THREE.Mesh(new THREE.SphereGeometry(.005,6,6),new THREE.MeshBasicMaterial({color:0xf00}));gled.position.set(.018,1.1,.2);AV.add(gled);
AV.userData={armL:aL,armR:aR,gled};S.add(AV);

// ═══════════════════════════════════════════
// BUILD SYSTEM
// ═══════════════════════════════════════════
const structures=[],rooms=[],surveyPoints=[];let tool='survey',built=0,avState='idle',buildT=0,target=new THREE.Vector3();
let goproOn=false,grainOn=false,godraysOn=false,aoOn=false,physicsOn=false,trainOn=false,showContour=false,currentMaterial='oak';
const goproFrames=[];

const mats={wall:new THREE.MeshStandardMaterial({color:0x998877,roughness:.65}),floor:new THREE.MeshStandardMaterial({color:0x776655,roughness:.55}),foundation:new THREE.MeshStandardMaterial({color:0x666666,roughness:.7}),roof:new THREE.MeshStandardMaterial({color:0x553322,roughness:.55}),framing:new THREE.MeshStandardMaterial({color:0xbb9955,roughness:.55}),plumbing:new THREE.MeshStandardMaterial({color:0x3366cc,roughness:.25,metalness:.3,emissive:0x112244,emissiveIntensity:.1}),electrical:new THREE.MeshStandardMaterial({color:0xddbb33,roughness:.25,metalness:.4,emissive:0x221100,emissiveIntensity:.1}),door:new THREE.MeshStandardMaterial({color:0x664422,roughness:.4}),window:new THREE.MeshPhysicalMaterial({color:0x8899cc,roughness:.08,metalness:.05,transmission:.35,thickness:.04})};

const interiorMats={oak:new THREE.MeshStandardMaterial({color:0xc4946c,roughness:.5}),walnut:new THREE.MeshStandardMaterial({color:0x5c3a21,roughness:.45}),marble:new THREE.MeshStandardMaterial({color:0xe8e0d8,roughness:.15,metalness:.05}),granite:new THREE.MeshStandardMaterial({color:0x555555,roughness:.2,metalness:.1}),tile:new THREE.MeshStandardMaterial({color:0xd4ccc0,roughness:.3}),carpet:new THREE.MeshStandardMaterial({color:0x8b7355,roughness:.9}),steel:new THREE.MeshStandardMaterial({color:0x888888,roughness:.25,metalness:.8})};

const surveyGroup=new THREE.Group();S.add(surveyGroup);

function placeSurveyMarker(pt){const m=new THREE.Group();m.add(new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.8,8),new THREE.MeshBasicMaterial({color:0xff4400}))).position.y=.4;m.add(new THREE.Mesh(new THREE.SphereGeometry(.08,8,8),new THREE.MeshBasicMaterial({color:0xff6600}))).position.y=.85;m.position.set(pt.x,hAt(pt.x,pt.z)+.01,pt.z);surveyGroup.add(m);surveyPoints.push({pos:pt.toArray(),height:hAt(pt.x,pt.z)})}

function build(type,pos){let m;const p=pos.clone();p.y=hAt(p.x,p.z);switch(type){
case'wall':m=new THREE.Mesh(new THREE.BoxGeometry(.95,.06,2.4),mats.wall);m.position.set(p.x,p.y+.03+1.2,p.z);break;
case'floor':m=new THREE.Mesh(new THREE.BoxGeometry(3,.05,3),mats.floor);m.position.set(p.x,p.y+.025,p.z);break;
case'foundation':m=new THREE.Mesh(new THREE.BoxGeometry(3,.2,3),mats.foundation);m.position.set(p.x,p.y+.1,p.z);break;
case'roof':{const g=new THREE.ConeGeometry(2.2,.6,4);g.rotateY(Math.PI/4);m=new THREE.Mesh(g,mats.roof);m.position.set(p.x,p.y+2.7,p.z);break}
case'framing':{m=new THREE.Group();for(let i=0;i<3;i++)m.add(new THREE.Mesh(new THREE.BoxGeometry(.06,2.5,.06),mats.framing)).position.set(p.x-1+i,p.y+.03+1.25,p.z);break}
case'plumbing':m=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,2.2,8),mats.plumbing);m.position.set(p.x,p.y+.03+1.1,p.z);break;
case'electrical':{m=new THREE.Group();m.add(new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,1.8,8),mats.electrical)).position.y=.9;m.add(new THREE.Mesh(new THREE.BoxGeometry(.08,.06,.12),mats.electrical)).position.y=.05;m.position.set(p.x,p.y+.03,p.z);break}
case'door':m=new THREE.Mesh(new THREE.BoxGeometry(.7,.05,2.1),mats.door);m.position.set(p.x,p.y+.03+1.05,p.z);break;
case'window':m=new THREE.Mesh(new THREE.BoxGeometry(.015,.7,.7),mats.window);m.position.set(p.x,p.y+.03+1.5,p.z);break;
case'tree':{m=new THREE.Group();m.add(new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,1.3,8),new THREE.MeshStandardMaterial({color:0x553311}))).position.y=.65;m.add(new THREE.Mesh(new THREE.SphereGeometry(.35,8,6),new THREE.MeshStandardMaterial({color:0x336633}))).position.y=1.45;m.position.set(p.x,p.y,p.z);break}
case'grade':m=new THREE.Mesh(new THREE.SphereGeometry(1.5,12,8,.5,1.5),new THREE.MeshStandardMaterial({color:0x3a2a10,roughness:.9,flatShading:true}));m.position.set(p.x,p.y-.3,p.z);break;
case'material':{const mat=interiorMats[currentMaterial];m=new THREE.Mesh(Math.random()>.5?new THREE.BoxGeometry(.8,.05,2):new THREE.BoxGeometry(2,.05,.8),mat);m.position.set(p.x,p.y+.03+.5,p.z);if(!rooms.find(r=>r.pos[0]===p.x&&r.pos[2]===p.z))rooms.push({pos:[p.x,p.z],material:currentMaterial,area:Math.round(Math.random()*20+8),ts:Date.now()});break}
}if(m){m.castShadow=true;m.receiveShadow=true;m.userData={type,pos:[p.x,p.z],ts:Date.now()};S.add(m);structures.push(m);built++;$('built-count').textContent=`BUILT: ${built}`}}

// ── Placement ──
const rc=new THREE.Raycaster(),ms=new THREE.Vector2(),gp=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function snap(v){return new THREE.Vector3(Math.round(v.x),Math.round(v.y),Math.round(v.z))}
function groundAt(e){ms.x=(e.clientX/W)*2-1;ms.y=-(e.clientY/H)*2+1;rc.setFromCamera(ms,cam);const t=new THREE.Vector3();rc.ray.intersectPlane(gp,t);return t?snap(t):null}

R.domElement.addEventListener('click',e=>{
  if(e.target.tagName==='BUTTON')return;const pt=groundAt(e);if(!pt)return;
  if(tool==='survey'){placeSurveyMarker(pt);return}
  if(tool==='room'){rooms.push({pos:[pt.x,pt.z],width:Math.round(Math.random()*5+3),depth:Math.round(Math.random()*5+3),area:0,material:'unassigned',ts:Date.now()});rooms[rooms.length-1].area=rooms[rooms.length-1].width*rooms[rooms.length-1].depth;$('msg').textContent=`🔍 Room ${rooms.length}: ${rooms[rooms.length-1].area}m²`;$('msg').style.opacity='1';setTimeout(()=>$('msg').style.opacity='0',2000);return}
  target.copy(pt);avState='walking';$('av-state').textContent='◈ WALKING';$('av-state').className='active';
});

// ── Tool switching ──
document.querySelectorAll('#sidebar button').forEach(b=>{b.addEventListener('click',e=>{e.stopPropagation();const t=b.dataset.t;
  if(t==='grain'){grainOn=!grainOn;grainPass.enabled=grainOn;b.classList.toggle('sel',grainOn);return}
  if(t==='godrays'){godraysOn=!godraysOn;godRaysPass.enabled=godraysOn;b.classList.toggle('sel',godraysOn);return}
  if(t==='ao'){aoOn=!aoOn;aoPass.enabled=aoOn;b.classList.toggle('sel',aoOn);return}
  if(t==='physics'){physicsOn=!physicsOn;$('phys-debug').style.display=physicsOn?'block':'none';b.classList.toggle('sel',physicsOn);return}
  if(t==='gopro'){goproOn=!goproOn;$('gopro').style.display=goproOn?'block':'none';b.classList.toggle('sel',goproOn);return}
  if(t==='contour'){showContour=!showContour;contourG.visible=showContour;b.classList.toggle('sel',showContour);return}
  if(t==='train'){trainOn=!trainOn;b.classList.toggle('sel',trainOn);return}
  if(t==='clear'){structures.forEach(s=>{if(!s.name)S.remove(s)});structures.length=0;rooms.length=0;built=0;$('built-count').textContent='BUILT: 0';surveyGroup.clear();surveyPoints.length=0;return}
  if(t==='export'){const data={survey:surveyPoints,rooms,structures:structures.filter(s=>!s.name).map(s=>({type:s.userData?.type,pos:s.userData?.pos,ts:s.userData?.ts})),exported:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`trench_survey_${Date.now()}.json`;a.click();return}
  if(t==='import-cad'){const inp=document.createElement('input');inp.type='file';inp.accept='.stl';inp.multiple=true;inp.onchange=async(e=>{const loader=new STLLoader();for(const file of e.target.files){const geo=loader.parse(await file.arrayBuffer());const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x889999,roughness:.3,metalness:.6}));mesh.position.set((Math.random()-.5)*6,hAt(0,0)+.5,(Math.random()-.5)*6);mesh.castShadow=true;mesh.receiveShadow=true;mesh.scale.set(.01,.01,.01);mesh.userData={type:'cad_import',name:file.name,ts:Date.now()};S.add(mesh);structures.push(mesh);built++;$('built-count').textContent=`BUILT: ${built}`;$('msg').textContent=`📦 ${file.name}`;$('msg').style.opacity='1';setTimeout(()=>$('msg').style.opacity='0',2000)}};inp.click();return}
  if(t==='material'){const ms=Object.keys(interiorMats);currentMaterial=ms[(ms.indexOf(currentMaterial)+1)%ms.length];b.textContent=`🎨 ${currentMaterial.toUpperCase()}`;return}
  tool=t;$('tool-name').textContent=t.toUpperCase();$('mode').textContent=`MODE: ${t.toUpperCase()}`;document.querySelectorAll('#sidebar button').forEach(b=>b.classList.remove('sel'));b.classList.add('sel');
})});

// ── Coords ──
R.domElement.addEventListener('mousemove',e=>{const pt=groundAt(e);if(pt)$('coords').textContent=`X:${pt.x.toFixed(1)} Z:${pt.z.toFixed(1)} ELEV:${hAt(pt.x,pt.z).toFixed(2)}m | ${surveyPoints.length} surveys | ${rooms.length} rooms`});

// ═══════════════════════════════════════════
// GOPRO
// ═══════════════════════════════════════════
const gR=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});gR.setSize(256,144);gR.shadowMap.enabled=true;$('gopro-canvas').replaceWith(gR.domElement);
const gCam=new THREE.PerspectiveCamera(80,256/144,.01,30);

// ═══════════════════════════════════════════
// LOOP
// ═══════════════════════════════════════════
const clk=new THREE.Clock();let fc=0,lf=0;
function loop(){requestAnimationFrame(loop);
  const dt=Math.min(clk.getDelta(),.2),t=performance.now()*.001;

  // SECTION 14: Physics-based avatar movement
  if(avState==='walking'){
    const dx=target.x-AV.position.x,dz=target.z-AV.position.z;
    const dist=Math.sqrt(dx*dx+dz*dz);
    if(dist>.12){
      // Force toward target with mass/inertia
      const force=physicsOn?12:8;
      avPhys.ax+=dx/dist*force*dt;avPhys.ay+=dz/dist*force*dt;
      // Damping (friction)
      avPhys.ax*=avPhys.inertia;avPhys.ay*=avPhys.inertia;
      // Velocity with cap
      const maxV=physicsOn?4:3.5;
      avPhys.vx=Math.max(-maxV,Math.min(maxV,avPhys.vx+avPhys.ax*dt));
      avPhys.vy=Math.max(-maxV,Math.min(maxV,avPhys.vy+avPhys.ay*dt));
      AV.position.x+=avPhys.vx*dt;AV.position.z+=avPhys.vy*dt;
      AV.lookAt(target.x,AV.position.y,target.z);
      AV.position.y=hAt(AV.position.x,AV.position.z)+Math.abs(Math.sin(t*10))*.025;
      AV.userData.armL.rotation.x=Math.sin(t*12)*.6;AV.userData.armR.rotation.x=-Math.sin(t*12)*.6;
    }else{
      avPhys.vx=0;avPhys.vy=0;avPhys.ax=0;avPhys.ay=0;AV.position.set(target.x,hAt(target.x,target.z),target.z);
      avState='building';buildT=0;$('av-state').textContent='◈ BUILDING';
    }
    if(physicsOn)$('phys-debug').textContent=`v:${avPhys.vx.toFixed(1)},${avPhys.vy.toFixed(1)} a:${avPhys.ax.toFixed(2)}`;
  }else if(avState==='building'){
    buildT+=dt*2.5;AV.userData.armL.rotation.x=Math.sin(buildT*10)*1.4-Math.PI*.35;AV.userData.armR.rotation.x=-Math.sin(buildT*10)*1.4-Math.PI*.35;
    AV.position.y=hAt(AV.position.x,AV.position.z)+Math.abs(Math.sin(buildT*14))*.04;
    if(buildT>=1){build(tool,target.clone());avState='idle';AV.userData.armL.rotation.x=0;AV.userData.armR.rotation.x=0;$('av-state').textContent='◈ IDLE';$('av-state').className='';}
  }else{
    AV.position.y=hAt(AV.position.x,AV.position.z)+Math.sin(t*1.8)*.008;
    AV.userData.armL.rotation.x=Math.sin(t*2.5)*.08;AV.userData.armR.rotation.x=-Math.sin(t*2.5)*.08;
  }

  // GoPro
  if(goproOn){AV.userData.gled.material.color.setHex(Math.sin(t*5)>.4?0xff0000:0x220000);gCam.position.copy(AV.position);gCam.position.y+=1.08;gCam.position.z+=.24;const ld=new THREE.Vector3(0,0,-1).applyQuaternion(AV.quaternion);gCam.lookAt(gCam.position.clone().add(ld));gR.render(S,gCam);if(trainOn&&fc%6===0){goproFrames.push({ts:t,pos:gCam.position.toArray(),look:ld.toArray(),built});if(goproFrames.length>2000)goproFrames.shift()}}

  // Update shader uniforms
  grainPass.uniforms.time.value=t;
  godRaysPass.uniforms.time.value=t;

  ctrl.update();composer.render();

  fc++;if(t-lf>.5){$('fps').textContent=`${Math.round(fc/(t-lf))} FPS`;fc=0;lf=t;}
}
window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
window.addEventListener('keydown',e=>{if(e.key==='e'&&goproFrames.length>0){const blob=new Blob([JSON.stringify(goproFrames,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`trench_training_${Date.now()}.json`;a.click();$('msg').textContent=`📤 ${goproFrames.length} frames`;$('msg').style.opacity='1';setTimeout(()=>$('msg').style.opacity='0',2000)}});
loop();
console.log('╔══════════════════════════════════════╗\n║ TRENCH BUILDER v4 — HYPERREAL PIPE  ║\n║ Film Grain · God Rays · SSAO · Phys ║\n║ 22 rendering principles applied      ║\n╚══════════════════════════════════════╝');
</script></body></html>
